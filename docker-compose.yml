services:
  postgres:
    image: postgres:16
    container_name: maburvm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maburvm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-maburvm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maburvm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: maburvm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  mailpit:
    image: axllent/mailpit:latest
    container_name: maburvm-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data

  panel:
    build:
      context: .
      dockerfile: Dockerfile.panel
    container_name: maburvm-panel
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-maburvm}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME: ${DB_NAME:-maburvm}
      DB_SSL_MODE: disable
      SERVER_PORT: 8080
      SERVER_HOST: 0.0.0.0
      # Crypto secrets are OPTIONAL: if unset, the panel generates strong random
      # keys on first boot and persists them under MABURVM_DATA_DIR (the volume
      # below), so they survive restarts. Set these only for multi-instance
      # deployments or to pin them to an external secret manager.
      MABURVM_DATA_DIR: /data
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      AES_KEY: ${AES_KEY:-}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-maburvm}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - panel_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: maburvm-agent
    restart: unless-stopped
    privileged: true
    ports:
      - "${AGENT_GRPC_PORT:-50051}:50051"
    environment:
      AGENT_GRPC_PORT: 50051
      AGENT_PANEL_ADDRESS: ${AGENT_PANEL_ADDRESS:-}
      AGENT_AUTH_TOKEN: ${AGENT_AUTH_TOKEN:-}
      LIBVIRT_URI: ${LIBVIRT_URI:-qemu:///system}
    volumes:
      - /var/run/libvirt:/var/run/libvirt
      - /var/lib/libvirt/images:/var/lib/libvirt/images

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: maburvm-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  panel_data:
    driver: local
  mailpit_data:
    driver: local
