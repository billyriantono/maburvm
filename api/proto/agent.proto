syntax = "proto3";

package agent;

option go_package = "github.com/maburvm/maburvm/internal/shared/grpc/pb;pb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// ============================================================================
// NodeAgent Service - Main gRPC service for panel-agent communication
// ============================================================================

// NodeAgent is the primary service for communication between the MaburVM Panel
// and Node Agents. It handles node registration, heartbeat monitoring,
// VM lifecycle management, metrics streaming, and network configuration.
service NodeAgent {
  // RegisterNode handles initial node registration when an agent connects
  // to the panel for the first time. The panel assigns a node ID and returns
  // authentication credentials for subsequent requests.
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);

  // Heartbeat establishes a bidirectional streaming connection for health
  // monitoring. Both panel and agent can send heartbeats to detect
  // connectivity issues and exchange status updates in real-time.
  rpc Heartbeat(stream HeartbeatRequest) returns (stream HeartbeatResponse);

  // ExecuteVMCommand sends VM lifecycle commands (create, start, stop, destroy)
  // to the node agent. This is a unary RPC as commands must complete
  // before returning a response.
  rpc ExecuteVMCommand(VMCommandRequest) returns (VMCommandResponse);

  // GetVMStatus retrieves the current state of a VM including resource usage,
  // running processes, and health information.
  rpc GetVMStatus(VMStatusRequest) returns (VMStatusResponse);

  // StreamVMMetrics opens a server-side streaming connection for real-time
  // VM metrics including CPU, memory, disk, and network statistics.
  rpc StreamVMMetrics(VMMetricsRequest) returns (stream VMMetricsResponse);

  // CreateSnapshot creates a point-in-time snapshot of a VM's disk state.
  // Can also be used to list, restore, or delete existing snapshots.
  rpc CreateSnapshot(SnapshotRequest) returns (SnapshotResponse);

  // ApplyNetworkConfig applies TC (traffic control) and iptables rules
  // to enforce bandwidth limits, firewall rules, and network isolation.
  rpc ApplyNetworkConfig(NetworkConfigRequest) returns (NetworkConfigResponse);

  // StartVNCProxy starts a noVNC proxy server for browser-based console access
  // to the VM. Returns connection details for the WebSocket VNC session.
  rpc StartVNCProxy(VNCProxyRequest) returns (VNCProxyResponse);

  // GetNodeInfo retrieves detailed system information about the node including
  // OS version, kernel version, CPU info, memory, disk, and libvirt version.
  rpc GetNodeInfo(GetNodeInfoRequest) returns (GetNodeInfoResponse);

  // ImportDisk imports a disk image from a source path to the VM's storage.
  // Used for VM migration from external sources.
  rpc ImportDisk(DiskImportRequest) returns (DiskImportResponse);

  // BackupDisk exports a VM's primary disk (compressed qcow2) and uploads it to
  // the node's configured object storage, returning the object key, size and
  // checksum. This is the real backup payload (not just metadata).
  rpc BackupDisk(BackupDiskRequest) returns (BackupDiskResponse);

  // RestoreDisk downloads a previously-backed-up qcow2 from object storage,
  // verifies its SHA256, and swaps it into the VM's primary disk. The VM MUST
  // be shut off; the agent rejects the call otherwise.
  rpc RestoreDisk(RestoreDiskRequest) returns (RestoreDiskResponse);

  // TestObjectStore checks that this node can use an object store: it writes a
  // small object, reads it back and deletes it. An agent without it answers
  // Unimplemented, which the panel reports as "needs an agent update".
  rpc TestObjectStore(TestObjectStoreRequest) returns (TestObjectStoreResponse);

  // DeleteBackupFiles removes stored backup files the panel cannot reach
  // itself (a path mounted on the node). Feature "backup_targets".
  rpc DeleteBackupFiles(DeleteBackupFilesRequest) returns (DeleteBackupFilesResponse);

  // GetLiveMetrics retrieves real-time system metrics from the node including
  // CPU usage, memory usage, disk usage, network I/O, disk I/O, and load average.
  rpc GetLiveMetrics(GetLiveMetricsRequest) returns (GetLiveMetricsResponse);

  // ScanVMs scans the node for all VMs via libvirt and returns their info for import
  rpc ScanVMs(ScanVMsRequest) returns (ScanVMsResponse);

  // CreateStorageVolume provisions a real disk image (qcow2/raw) in a storage
  // pool directory on the node, returning its path and actual size.
  rpc CreateStorageVolume(CreateStorageVolumeRequest) returns (CreateStorageVolumeResponse);

  // DeleteStorageVolume removes a previously provisioned volume file from the node.
  rpc DeleteStorageVolume(DeleteStorageVolumeRequest) returns (DeleteStorageVolumeResponse);

  // GetStorageReport measures the filesystem behind each given pool path, and
  // reports where the node's domains actually keep their disks.
  //
  // Both halves exist because of the same failure: the panel used to show every
  // pool the node's ROOT filesystem usage, so a pool directory holding nothing
  // reported gigabytes in use while the volume holding every customer's disk —
  // mounted elsewhere and 76% full — was invisible. Measuring the pool's own
  // path fixes the number; reporting the disk locations is what reveals storage
  // in use that nobody registered as a pool at all.
  rpc GetStorageReport(GetStorageReportRequest) returns (GetStorageReportResponse);

  // MigrateVM starts a live move of a domain from this (source) node to
  // dest_address over the migration link, in the background; progress comes
  // from GetMigrationProgress. The old form (dest_uri alone) is refused.
  rpc MigrateVM(MigrateVMRequest) returns (MigrateVMResponse);

  // SyncTemplate downloads/caches an OS template image on this node and returns
  // its local path, size and checksum (idempotent — reuses a cached copy).
  rpc SyncTemplate(SyncTemplateRequest) returns (SyncTemplateResponse);

  // AttachDisk provisions a new data volume and hot-plugs it into a VM as the
  // next free virtio target. DetachDisk removes it (and optionally deletes it).
  rpc AttachDisk(AttachDiskRequest) returns (AttachDiskResponse);
  rpc DetachDisk(DetachDiskRequest) returns (DetachDiskResponse);

  // DefineNetwork creates+starts an isolated/NAT libvirt network (a managed
  // bridge for private VPC segments). UndefineNetwork removes it.
  rpc DefineNetwork(DefineNetworkRequest) returns (DefineNetworkResponse);
  rpc UndefineNetwork(UndefineNetworkRequest) returns (UndefineNetworkResponse);

  // ProbeIPs ARP-probes a set of IPs on a bridge and returns those that answer
  // (i.e. are live on the wire). The panel uses this to detect IPs already used
  // by VMs it doesn't manage (e.g. pre-existing unmanaged guests), so it never
  // allocates a live customer IP and its IPAM view reflects reality.
  rpc ProbeIPs(ProbeIPsRequest) returns (ProbeIPsResponse);

  // ConfigureFloatingIP attaches or detaches a floating (elastic) IP on the
  // host: the address is bound to the uplink bridge and 1:1-NATed to the VM's
  // own address, so it can be moved between VMs on the node without any guest
  // cooperation. Idempotent — the panel re-applies attachments after a node
  // reboot, since iptables rules are runtime-only state.
  rpc ConfigureFloatingIP(FloatingIPRequest) returns (FloatingIPResponse);

  // ConfigureVPC creates or removes a tenant VPC on this node: a bridge for the
  // guests plus a router network namespace holding the VPC's gateway and NAT.
  //
  // The gateway deliberately lives in a namespace rather than on the host. The
  // host has a single routing table, so two tenants using the same subnet would
  // otherwise produce two competing routes and the kernel would deliver both
  // tenants' traffic to whichever bridge came first — a cross-tenant misdelivery,
  // not merely a clash. A namespace per VPC gives each its own routing table, so
  // overlapping tenant subnets are safe.
  rpc ConfigureVPC(VPCRequest) returns (VPCResponse);

  // SetQuarantine cuts a guest off the network, or puts it back, without
  // stopping it — the owner keeps console access and their data while the abuse
  // stops. Keyed on MAC rather than VM id because the guests that need this are
  // often ones the panel does not manage, and an abusive guest may be running a
  // spoofed or duplicated address.
  rpc SetQuarantine(SetQuarantineRequest) returns (SetQuarantineResponse);

  // SetConsoleAccess enforces console enable/disable on the domain itself.
  //
  // The panel used to record this as a flag and nothing more, which gated its
  // own proxy while qemu carried on listening on 0.0.0.0 — so a "disabled"
  // console was still reachable by anyone who could route to the node and knew
  // the VNC password. Enforcement has to happen where the socket is.
  rpc SetConsoleAccess(SetConsoleAccessRequest) returns (SetConsoleAccessResponse);

  // ConsoleStream carries a VM's console over this authenticated channel, so
  // the console socket can stay on the node's loopback and its traffic is not
  // sent in the clear. An agent without it answers Unimplemented, and the panel
  // connects to the console port directly as it did before.
  rpc ConsoleStream(stream ConsoleData) returns (stream ConsoleData);

  // GetExportProgress reports the disk exports running on this node right now.
  //
  // A compressed export of a large disk takes hours, during which the panel
  // showed only "pending" — indistinguishable from a job that had never
  // started, and from one that was stuck. Operators were left guessing whether
  // to wait or to intervene.
  rpc GetExportProgress(GetExportProgressRequest) returns (GetExportProgressResponse);

  // GetGuestConnections reports how fast each guest on this node is opening new
  // outbound connections. Bandwidth cannot answer that question: a port scan is
  // enormous in packets and connections but trivial in bytes, so traffic graphs
  // stay flat while the node's conntrack table fills and every tenant on it
  // loses connectivity.
  rpc GetGuestConnections(GetGuestConnectionsRequest) returns (GetGuestConnectionsResponse);

  // SetNullRoute drops all traffic to one address for a set time, or lifts it
  // early. The node keeps the list in a file and lifts each entry itself when
  // its time is up, so a null-route never outlives its purpose because the
  // panel was unreachable. An agent without it answers Unimplemented.
  rpc SetNullRoute(SetNullRouteRequest) returns (SetNullRouteResponse);

  // UpdateAgent replaces this agent's binary with one streamed from the panel.
  // The first chunk carries the metadata; the agent verifies the digest, makes
  // sure the new binary runs, then hands the swap to a detached systemd job that
  // restarts the service and rolls back if it does not come up. The response is
  // sent before the restart, so success means "scheduled", not "running".
  rpc UpdateAgent(stream AgentUpdateChunk) returns (AgentUpdateResponse);

  // SetVMLimits applies a VM's CPU and disk caps to its definition and, when it
  // is running, to the running guest, so one busy VM cannot starve the others
  // on the node. An agent without it answers Unimplemented.
  rpc SetVMLimits(SetVMLimitsRequest) returns (SetVMLimitsResponse);

  // SetVMHardware changes the named parts of a VM's virtual hardware (CPU
  // model and topology, dedicated cores, huge pages, watchdog, restart on
  // crash) in its saved definition. A running VM takes them at its next power
  // off and on; nothing is restarted. An agent without it answers
  // Unimplemented.
  rpc SetVMHardware(SetVMHardwareRequest) returns (SetVMHardwareResponse);

  // GetPreflight checks that the host is set up the way the agent expects
  // (KVM, libvirt, qemu-img, bridges, storage pool directories, bridge
  // netfilter, tools, clock), one check at a time. Read-only. An agent
  // without it answers Unimplemented.
  rpc GetPreflight(PreflightRequest) returns (PreflightResponse);

  // The RPCs below move a VM between nodes over a migration link the panel
  // sets up: each node has its own key, accepted on the other nodes only from
  // its address and only for a libvirt connection, and each node pins the
  // others' SSH host keys. An agent without them answers Unimplemented and the
  // panel refuses to move VMs to or from that node until it is updated.

  // GetMigrationInfo describes this node for a migration (its migration key,
  // SSH host keys and CPU) and, with vm_id, that VM's disks and state. With
  // peer_address it also tries the migration link to that node.
  rpc GetMigrationInfo(GetMigrationInfoRequest) returns (GetMigrationInfoResponse);

  // SetMigrationPeers replaces the nodes this node trusts for migration. A
  // node left out can no longer connect here, and is no longer connected to.
  rpc SetMigrationPeers(SetMigrationPeersRequest) returns (SetMigrationPeersResponse);

  // PrepareMigrationTarget checks (dry_run) or prepares this node to receive
  // a VM: its disk files in the chosen pool and its seed image.
  rpc PrepareMigrationTarget(PrepareMigrationTargetRequest) returns (PrepareMigrationTargetResponse);

  // PullMigratedVM copies a stopped VM's disks from its node over the
  // migration link and defines it here. It returns at once; progress comes
  // from GetMigrationProgress.
  rpc PullMigratedVM(PullMigratedVMRequest) returns (PullMigratedVMResponse);

  // GetMigrationProgress reports a migration this node runs (a live move on
  // the source, an offline copy on the destination).
  rpc GetMigrationProgress(GetMigrationProgressRequest) returns (GetMigrationProgressResponse);

  // AbortMigration stops a migration this node runs. The VM stays where it was.
  rpc AbortMigration(AbortMigrationRequest) returns (AbortMigrationResponse);

  // FinishMigrationTarget confirms a VM that arrived here (commit), or removes
  // the files a failed migration prepared here and nothing else.
  rpc FinishMigrationTarget(FinishMigrationTargetRequest) returns (FinishMigrationTargetResponse);

  // FinishMigrationSource removes a VM that now runs on another node: its
  // definition, the disk files it owned here and its host network rules.
  rpc FinishMigrationSource(FinishMigrationSourceRequest) returns (FinishMigrationSourceResponse);

  // ResizeVMDisk grows one disk of a VM, the primary one or an extra one,
  // whether the VM runs or not. It never shrinks a disk.
  rpc ResizeVMDisk(ResizeVMDiskRequest) returns (ResizeVMDiskResponse);

  // MoveVMDisk starts moving one disk of a VM to another storage pool of this
  // node: a copy while the VM is shut off, a block copy while it runs. It
  // returns at once; GetMigrationProgress and AbortMigration follow it with
  // move_id as the migration id.
  rpc MoveVMDisk(MoveVMDiskRequest) returns (MoveVMDiskResponse);

  // ListOrphanDisks lists the disk files and logical volumes in the given
  // pools that no domain on this node uses. Read-only.
  rpc ListOrphanDisks(ListOrphanDisksRequest) returns (ListOrphanDisksResponse);

  // DeleteOrphanDisk removes one of those after checking it again: still
  // unused, still in a registered pool, unchanged since it was listed.
  rpc DeleteOrphanDisk(DeleteOrphanDiskRequest) returns (DeleteOrphanDiskResponse);

  // Shared storage pools: join or leave one, and the token file that proves
  // nodes see the same storage.
  rpc SetSharedPool(SetSharedPoolRequest) returns (SetSharedPoolResponse);
  rpc SharedPoolToken(SharedPoolTokenRequest) returns (SharedPoolTokenResponse);

  // SetFencedVMs replaces the list of VMs that were recovered onto another
  // node while this one was down ("vm_recovery" feature). The agent never
  // starts one and turns its autostart off; it does not stop one that runs.
  // The answer says what is left of each here.
  rpc SetFencedVMs(SetFencedVMsRequest) returns (SetFencedVMsResponse);

  // RemoveFencedVM removes this node's copy of a fenced VM: its definition,
  // and its disks except those in a shared pool (they are the VM's disks on
  // its new node).
  rpc RemoveFencedVM(RemoveFencedVMRequest) returns (RemoveFencedVMResponse);

  // PutImage stores a file uploaded to the panel (an ISO) in this node's image
  // cache. The first chunk names it; the data is checked against its sha256.
  rpc PutImage(stream ImageChunk) returns (PutImageResponse);

  // ConfigureNIC lists, adds or removes a VM's network cards, or changes a
  // card's MAC ("vm_nics" feature). Adding and removing happen live where the
  // guest allows it and always in the VM's definition; a MAC changes in the
  // definition only and takes effect when the VM is next started.
  rpc ConfigureNIC(ConfigureNICRequest) returns (ConfigureNICResponse);

  // SetVLANBridges names the node's bridges that carry per-VM VLANs, each
  // with its uplink ("vlan_bridges" feature). It replaces what the agent's
  // environment says; use_environment goes back to it.
  rpc SetVLANBridges(SetVLANBridgesRequest) returns (SetVLANBridgesResponse);
}

// ============================================================================
// Node Registration
// ============================================================================

// RegisterNodeRequest is sent by the agent to register with the panel.
message RegisterNodeRequest {
  // hostname is the system's hostname
  string hostname = 1;

  // agent_version is the version of the agent software
  string agent_version = 2;

  // total_resources describes the total capacity of the node
  VMResources total_resources = 3;

  // capabilities lists features supported by this node (e.g., "kvm", "zfs", "snapshot")
  repeated string capabilities = 4;

  // labels are user-defined key-value pairs for node organization
  map<string, string> labels = 5;

  // public_ip is the node's public IP address
  string public_ip = 6;

  // region is the geographical region where the node is located
  string region = 7;
}

// RegisterNodeResponse is returned by the panel after successful registration.
message RegisterNodeResponse {
  // node_id is the unique identifier assigned to this node
  string node_id = 1;

  // auth_token is the bearer token for authenticating subsequent requests
  string auth_token = 2;

  // refresh_interval specifies how often the agent should send heartbeats
  google.protobuf.Duration refresh_interval = 3;

  // metrics_interval specifies how often to collect and report metrics
  google.protobuf.Duration metrics_interval = 4;
}

// ============================================================================
// Heartbeat
// ============================================================================

// HeartbeatRequest is sent by the agent to report its current status.
message HeartbeatRequest {
  // timestamp when this heartbeat was generated
  google.protobuf.Timestamp timestamp = 1;

  // node_id identifies the sending node
  string node_id = 2;

  // available_resources shows current available capacity
  VMResources available_resources = 3;

  // active_vms lists currently running VMs on this node
  repeated string active_vm_ids = 4;

  // system_load contains node-level system metrics
  SystemLoad system_load = 5;

  // vm_bandwidth_usage reports per-VM traffic counters
  repeated VMBandwidthReport vm_bandwidth_usage = 6;
}

// GuestConnectionReport counts new outbound TCP connections attempted by one
// guest, as measured by the agent's own iptables counters.
//
// Reported per MAC and covering every libvirt domain on the node, including
// ones the panel has never seen: on 2026-08-08 the guests that exhausted a
// node's conntrack table were legacy VMs the panel did not manage, so anything
// keyed on the panel's VM list would have shown nothing wrong.
message GuestConnectionReport {
  // mac is the guest interface's hardware address — the only identifier the
  // host assigns and the guest cannot quietly change.
  string mac = 1;

  // vm_id is the libvirt domain UUID, empty when the domain cannot be resolved.
  string vm_id = 2;

  // interface_name is the host-side tap (e.g. vnet3).
  string interface_name = 3;

  // syn_packets is a CUMULATIVE count of new outbound TCP connections since the
  // counter was created. The panel differences successive heartbeats to get a
  // rate; a counter that goes backwards means the agent restarted and the
  // sample is simply skipped.
  int64 syn_packets = 4;

  // quarantined reports whether this guest's traffic is currently being dropped.
  bool quarantined = 5;

  // syn_in_packets is a CUMULATIVE count of new TCP connections arriving for
  // the guest, from a counting rule on its tap; 0 when the tap is unknown.
  int64 syn_in_packets = 6;

  // packets_out and packets_in are CUMULATIVE packets the guest sent and
  // received, read from its tap. They restart when the guest's tap does.
  int64 packets_out = 7;
  int64 packets_in = 8;
}

// NullRoute is one address a node drops all traffic to until until_unix.
message NullRoute {
  string ip = 1;
  int64 until_unix = 2;
  string reason = 3;
}

message SetNullRouteRequest {
  // ip is a single IPv4 or IPv6 host address.
  string ip = 1;

  // minutes is how long the null-route lasts when on; at most a week.
  int32 minutes = 2;

  // on true adds (or extends) the null-route, false lifts it.
  bool on = 3;

  // reason is recorded in the node's file next to the address.
  string reason = 4;
}

message SetNullRouteResponse {
  bool success = 1;

  // null_routes is every null-route in force after the change.
  repeated NullRoute null_routes = 2;

  ErrorResponse error = 3;
}

// VMBandwidthReport contains cumulative traffic counters for a single VM.
// The agent reads these from /sys/class/net/<vnet>/statistics/.
message VMBandwidthReport {
  // vm_id is the VM identifier
  string vm_id = 1;

  // rx_bytes is the total bytes received since VM boot (cumulative counter)
  int64 rx_bytes = 2;

  // tx_bytes is the total bytes transmitted since VM boot (cumulative counter)
  int64 tx_bytes = 3;

  // interface_name is the vnet interface name (e.g., vnet0)
  string interface_name = 4;
}

// HeartbeatResponse is sent by the panel in response to heartbeats.
message HeartbeatResponse {
  // timestamp when this response was generated
  google.protobuf.Timestamp timestamp = 1;

  // commands_pending indicates if there are pending commands for this node
  bool commands_pending = 2;

  // config_update signals if the node should fetch new configuration
  bool config_update = 3;

  // acknowledged confirms the heartbeat was received
  bool acknowledged = 4;
}

// SystemLoad contains node-level system metrics.
message SystemLoad {
  // cpu_percent is the current CPU utilization (0-100)
  double cpu_percent = 1;

  // memory_used_bytes is the amount of memory in use
  int64 memory_used_bytes = 2;

  // memory_total_bytes is the total available memory
  int64 memory_total_bytes = 3;

  // disk_io_read_bytes_per_sec is disk read throughput
  int64 disk_io_read_bytes_per_sec = 4;

  // disk_io_write_bytes_per_sec is disk write throughput
  int64 disk_io_write_bytes_per_sec = 5;

  // network_rx_bytes_per_sec is network receive throughput
  int64 network_rx_bytes_per_sec = 6;

  // network_tx_bytes_per_sec is network transmit throughput
  int64 network_tx_bytes_per_sec = 7;
}

// ============================================================================
// VM Resources
// ============================================================================

// VMResources defines CPU, memory, and disk allocation for a VM.
message VMResources {
  // vcpus is the number of virtual CPUs
  int32 vcpus = 1;

  // memory_mb is the amount of RAM in megabytes
  int64 memory_mb = 2;

  // disk_gb is the disk size in gigabytes
  int64 disk_gb = 3;

  // swap_mb is the swap size in megabytes (optional)
  int64 swap_mb = 4;

  // network_bandwidth_mbps is the network bandwidth limit in Mbps
  int32 network_bandwidth_mbps = 5;

  // iops_limit is not read by the agent; limits carries the disk caps.
  int32 iops_limit = 6;

  // limits are the VM's CPU and disk caps, put in the domain when it is
  // created. Unset = no limits.
  VMLimits limits = 7;
}

// VMLimits caps what a VM may take from its node. Zero in a field is no limit.
message VMLimits {
  // cpu_weight is the VM's CPU priority against the others on the node: 100 is
  // normal. 0 leaves the node's default. The agent converts it to the host's
  // shares scale.
  int32 cpu_weight = 1;
  // cpu_cap_percent caps each vCPU at this share of one host core (1-100).
  int32 cpu_cap_percent = 2;
  // Disk caps, per disk: a total, or separate read and write limits.
  int64 total_iops_sec = 3;
  int64 read_iops_sec = 4;
  int64 write_iops_sec = 5;
  int64 total_bytes_sec = 6;
  int64 read_bytes_sec = 7;
  int64 write_bytes_sec = 8;
}

message SetVMLimitsRequest {
  string vm_id = 1;
  // Unset clears every limit.
  VMLimits limits = 2;
}

// VMHardware is a VM's virtual hardware beyond its size. The zero value is a
// plain VM, as every VM was before it existed.
message VMHardware {
  // cpu_model: "" is the host's own CPU, "host-model", or a named model. On a
  // create the agent also reads VMConfig.metadata["cpu_model"].
  string cpu_model = 1;
  // sockets and threads (per core) shape the vCPUs; the cores follow from the
  // vCPU count. A shape that does not divide is one socket of single cores.
  int32 sockets = 2;
  int32 threads = 3;
  // pinned_cpus are host cores, one per vCPU in order ("4-7"); empty is none.
  string pinned_cpus = 4;
  // numa places the memory on the NUMA nodes of pinned_cpus.
  bool numa = 5;
  bool hugepages = 6;
  // watchdog: a guest watchdog that resets a hung guest.
  bool watchdog = 7;
  // restart_on_crash: the agent starts the VM again when it crashes, backing
  // off, and stops after repeated crashes.
  bool restart_on_crash = 8;
  // secure_boot and tpm are read on a create only (an installed system does
  // not survive a change of firmware). secure_boot needs VMConfig.metadata
  // ["firmware"] = "uefi".
  bool secure_boot = 9;
  bool tpm = 10;
}

message SetVMHardwareRequest {
  string vm_id = 1;
  VMHardware hardware = 2;
  // fields names the parts to change: "cpu_model", "topology", "pinning"
  // (pinned_cpus and numa), "hugepages", "watchdog", "restart_on_crash".
  // Empty changes them all.
  repeated string fields = 3;
}

message SetVMHardwareResponse {
  bool success = 1;
  // restart_required: the VM is running and takes the change at its next
  // power off and on.
  bool restart_required = 2;
  string message = 3;
  ErrorResponse error = 4;
}

message SetVMLimitsResponse {
  bool success = 1;
  // restart_required: the definition has the limits but the running guest
  // could not take them; they apply from its next boot. message says why.
  bool restart_required = 2;
  string message = 3;
  ErrorResponse error = 4;
}

// ============================================================================
// VM Commands
// ============================================================================

// VMCommandType enumerates the possible VM lifecycle operations.
enum VMCommandType {
  VM_COMMAND_TYPE_UNSPECIFIED = 0;
  VM_COMMAND_TYPE_CREATE = 1;    // Create a new VM
  VM_COMMAND_TYPE_START = 2;     // Start an existing VM
  VM_COMMAND_TYPE_STOP = 3;      // Graceful shutdown
  VM_COMMAND_TYPE_FORCE_STOP = 4;// Force power off
  VM_COMMAND_TYPE_RESTART = 5;   // Restart the VM
  VM_COMMAND_TYPE_DESTROY = 6;   // Delete the VM and its data
  VM_COMMAND_TYPE_PAUSE = 7;     // Pause execution
  VM_COMMAND_TYPE_RESUME = 8;    // Resume from pause
  VM_COMMAND_TYPE_REBUILD = 9;   // Reinstall OS (replace disk from template)
  VM_COMMAND_TYPE_RESIZE = 10;   // Change vCPU/memory allocation
  VM_COMMAND_TYPE_RESET_PASSWORD = 11; // Reset the guest root password
  VM_COMMAND_TYPE_ATTACH_ISO = 12; // Attach a bootable install/rescue ISO
  VM_COMMAND_TYPE_DETACH_ISO = 13; // Detach the install/rescue ISO
  VM_COMMAND_TYPE_REPAIR_CONSOLE = 14; // Inject a VNC <graphics> device into a domain that lacks one (restarts the VM)
  // Boot a stopped VM into the built-in rescue system: config.image_id is the
  // rescue image, config.root_password and config.ssh_public_key its one-time
  // credentials, config.network_config its address. The VM's own disks are
  // attached to it. Needs the agent feature "builtin_rescue".
  VM_COMMAND_TYPE_RESCUE = 15;
  VM_COMMAND_TYPE_UNRESCUE = 16; // Take the rescue system's disk out again (VM stopped)
  // Define a VM on disks that exist already (adopt_disks), from config as
  // CREATE builds it. Nothing is created, copied or started. For a VM
  // recovered from a failed node onto another member of its shared pool.
  // Needs the agent feature "vm_recovery".
  VM_COMMAND_TYPE_ADOPT = 17;
}

// DiskStorageDisposition is the fail-closed, idempotent accountability verdict
// the agent returns for destructive disk/storage lifecycle operations. It lets
// the panel retain quota accounting when an operation cannot be proven safe.
//
// Backward-compatible addition: never renumber. New callers read these; older
// callers that omit operation_id get UNKNOWN/PRESENT on ambiguous states.
enum DiskStorageDisposition {
  // DISK_STORAGE_DISPOSITION_UNSPECIFIED is the zero value (no verdict emitted).
  DISK_STORAGE_DISPOSITION_UNSPECIFIED = 0;
  // DISK_STORAGE_DISPOSITION_UNKNOWN: the agent could NOT prove the disk/storage
  // is absent or present (timeout, transport loss, ambiguous recovery). The panel
  // MUST retain quota accounting — this is never a success.
  DISK_STORAGE_DISPOSITION_UNKNOWN = 1;
  // DISK_STORAGE_DISPOSITION_PRESENT: the backing volume and/or libvirt attachment
  // is still present. Must NOT be reported as a destructive/accounting-safe success.
  DISK_STORAGE_DISPOSITION_PRESENT = 2;
  // DISK_STORAGE_DISPOSITION_ATTACHED: the libvirt attachment is confirmed present
  // (used by successful attach, or to reject an unsafe detach that left it attached).
  DISK_STORAGE_DISPOSITION_ATTACHED = 3;
  // DISK_STORAGE_DISPOSITION_ABSENT: both libvirt attachment and backing storage
  // are confirmed gone. Safe to release quota accounting.
  DISK_STORAGE_DISPOSITION_ABSENT = 4;
}

// VMCommandRequest sends a lifecycle command to a VM.
message VMCommandRequest {
  // vm_id is the unique identifier for the VM
  string vm_id = 1;

  // command specifies the operation to perform
  VMCommandType command = 2;

  // config is required for CREATE commands
  VMConfig config = 3;

  // timeout_seconds specifies max time to wait for the command (0 = default)
  int32 timeout_seconds = 4;

  // async if true, returns immediately without waiting for completion
  bool async = 5;

  // operation_id is an idempotency key for destructive operations (DESTROY and
  // any future destructive command). Callers MUST supply a nonempty, bounded,
  // opaque operation ID so the agent can persist a durable manifest and return
  // the recorded result on retry after response loss. Omitting it makes the
  // agent fail closed (UNKNOWN/PRESENT) for destructive commands.
  string operation_id = 6;

  // pool_path is the directory the VM's disk (and its cloud-init seed) is
  // provisioned into, for CREATE.
  //
  // Empty means the node's own default, which is what every caller used to send.
  // That default is /var/lib/libvirt/images — on the node's ROOT filesystem —
  // so every new VM landed on the OS volume regardless of what storage the
  // operator had provisioned for VMs. Filling that volume does not merely fail
  // the next VM: it takes libvirt, the agent and logging down with it.
  string pool_path = 8;

  // delete_volumes requests that the VM's managed backing storage be destroyed
  // along with the domain. This is the explicit destructive-data-volume flag for
  // the DESTROY command. When false (or omitted), the agent must NOT claim an
  // accounting-safe destructive success; any residual storage yields
  // UNKNOWN/PRESENT. Behavior is wired in a later lane (C2); the field exists now
  // for backward-compatible rolling rollout.
  bool delete_volumes = 7;

  // object_store is where an "s3://" image reference is read from, for CREATE.
  // Unset means the store in the node's own environment file.
  ObjectStore object_store = 9;

  // pool_type is the type of pool_path: "" or "dir" for a directory, "lvm"
  // (pool_path is a volume group) or "lvmthin" (pool_path is "vg/thinpool").
  string pool_type = 10;

  // lvm_pools are the LVM pools the panel has registered on this node. A
  // logical volume is grown or removed only when it lives in one of them.
  repeated LVMPool lvm_pools = 11;

  // remove_foreign_volumes, for DESTROY, also removes the VM's logical volumes
  // that MaburVM did not create (an imported VM's), when they live in a
  // registered pool. The operator confirmed it; without it they are kept.
  bool remove_foreign_volumes = 12;

  // adopt_disks are the VM's existing disks, for ADOPT: vda first. Each must
  // be a file in a shared pool this node is a member of.
  repeated AdoptDisk adopt_disks = 13;
}

// AdoptDisk is one existing disk of a VM being adopted.
message AdoptDisk {
  string target = 1;
  string path = 2;
}

// LVMPool is a volume group, or a thin pool inside one, registered as a pool.
message LVMPool {
  string vg = 1;
  // thin_pool is empty for a thick pool.
  string thin_pool = 2;
}

// KeptVolume is a block device a DESTROY left in place, and why.
message KeptVolume {
  string path = 1;
  string target = 2;
  int64 size_bytes = 3;
  // vg and thin_pool name the registered pool holding it; empty when none does.
  string vg = 4;
  string thin_pool = 5;
  string reason = 6;
}

// VMCommandResponse reports the result of a VM command.
message VMCommandResponse {
  // success indicates if the command completed successfully
  bool success = 1;

  // vm_id of the affected VM
  string vm_id = 2;

  // command that was executed
  VMCommandType command = 3;

  // error details if success is false
  ErrorResponse error = 4;

  // state is the new VM state after the command
  VMState state = 5;

  // message contains additional information about the result
  string message = 6;

  // operation_id echoes the idempotency key supplied in the request (if any).
  string operation_id = 7;

  // storage_disposition reports the fail-closed disk/storage verdict for
  // destructive commands (esp. DESTROY). UNSPECIFIED for non-disk commands.
  DiskStorageDisposition storage_disposition = 8;

  // restored_disks are the data disks a CREATE made from restore_disks, with
  // where each is on the node.
  repeated BackupDiskFile restored_disks = 9;

  // kept_volumes are the block devices a DESTROY did not remove.
  repeated KeptVolume kept_volumes = 10;
}

// VMConfig defines the configuration for creating a new VM.
message VMConfig {
  // resources specifies CPU, memory, and disk allocation
  VMResources resources = 1;

  // image_id is the OS image to use (e.g., "ubuntu-22.04")
  string image_id = 2;

  // network_config defines network interfaces and settings
  VMNetworkConfig network_config = 3;

  // storage_config defines additional storage volumes
  StorageConfig storage_config = 4;

  // ssh_public_key for initial user access
  string ssh_public_key = 5;

  // user_data is cloud-init compatible configuration
  string user_data = 6;

  // metadata is key-value pairs for VM identification
  map<string, string> metadata = 7;

  // vnc_enabled enables VNC console access
  bool vnc_enabled = 8;

  // vnc_password sets a password for VNC access (optional)
  string vnc_password = 9;

  // root_password, when set (RESET_PASSWORD command), is the new guest root
  // password to apply via the guest agent.
  string root_password = 10;

  // restore_disks are the data disks of a backup restored as a new VM (CREATE
  // with an "s3://" image). Each is downloaded and attached with its target
  // before the first boot.
  repeated BackupDiskFile restore_disks = 11;

  // restore_layers are the images under an incremental backup's primary disk,
  // the full backup first. Sent only to an agent with "incremental_backup".
  repeated BackupLayer restore_layers = 12;

  // hardware is the VM's virtual hardware profile, for CREATE (and, for
  // pinned_cpus and topology, RESIZE). Sent only to an agent with the
  // "vm_hardware" feature; older agents ignore it.
  VMHardware hardware = 13;
}

// ============================================================================
// VM State
// ============================================================================

// VMState represents the current state of a virtual machine.
enum VMState {
  VM_STATE_UNSPECIFIED = 0;
  VM_STATE_PENDING = 1;      // VM is being created/configured
  VM_STATE_RUNNING = 2;      // VM is actively running
  VM_STATE_STOPPED = 3;      // VM is powered off
  VM_STATE_PAUSED = 4;       // VM execution is paused
  VM_STATE_ERROR = 5;        // VM is in an error state
  VM_STATE_MIGRATING = 6;    // VM is being migrated
  VM_STATE_SNAPSHOTTING = 7; // Snapshot operation in progress
  VM_STATE_DESTROYED = 8;    // VM has been destroyed
}

// VMStatusRequest queries the current state of a VM.
message VMStatusRequest {
  // vm_id is the VM to query
  string vm_id = 1;

  // include_metrics if true, includes current resource usage
  bool include_metrics = 2;
}

// VMStatusResponse contains the current VM status.
message VMStatusResponse {
  // vm_id of the queried VM
  string vm_id = 1;

  // current state of the VM
  VMState state = 2;

  // uptime_seconds since the VM was started
  int64 uptime_seconds = 3;

  // pid is the process ID of the VM on the host (if running)
  int32 pid = 4;

  // current_resources shows actual resource usage
  VMResourceUsage current_resources = 5;

  // ip_addresses assigned to the VM
  repeated string ip_addresses = 6;

  // vnc_port if VNC is enabled
  int32 vnc_port = 7;

  // last_state_change timestamp
  google.protobuf.Timestamp last_state_change = 8;

  // error_message if VM is in ERROR state
  string error_message = 9;

  // configured_resources is the domain's real spec (vcpus, memory_mb, disk_gb)
  // so the panel can catch out-of-band resizes; zero fields are unknown.
  VMResources configured_resources = 10;

  // crash_restarts is how often the VM crashed within the last hour, for a VM
  // whose policy is to restart on crash; crash_restart_paused that the agent
  // stopped restarting it until someone starts it.
  int32 crash_restarts = 11;
  bool crash_restart_paused = 12;

  // guest_agent_silent: the VM's guest agent did not answer recently, so its
  // addresses come from the host's DHCP leases and ARP table.
  bool guest_agent_silent = 13;
}

// VMResourceUsage contains actual resource consumption metrics.
message VMResourceUsage {
  // cpu_percent is current CPU utilization (0-100 per vCPU)
  double cpu_percent = 1;

  // memory_used_mb is current memory consumption
  int64 memory_used_mb = 2;

  // memory_total_mb is allocated memory
  int64 memory_total_mb = 3;

  // disk_read_bytes is total bytes read from disk
  int64 disk_read_bytes = 4;

  // disk_write_bytes is total bytes written to disk
  int64 disk_write_bytes = 5;

  // disk_read_iops is current read IOPS
  int32 disk_read_iops = 6;

  // disk_write_iops is current write IOPS
  int32 disk_write_iops = 7;

  // network_rx_bytes is total bytes received
  int64 network_rx_bytes = 8;

  // network_tx_bytes is total bytes transmitted
  int64 network_tx_bytes = 9;
}

// ============================================================================
// VM Metrics Streaming
// ============================================================================

// VMMetricsRequest initiates a metrics stream for one or more VMs.
message VMMetricsRequest {
  // vm_ids to monitor (empty = all VMs on node)
  repeated string vm_ids = 1;

  // interval_ms between metric samples
  int32 interval_ms = 2;

  // metric_types to include (empty = all)
  repeated MetricType metric_types = 3;
}

// VMMetricsResponse contains a single metrics sample.
message VMMetricsResponse {
  // timestamp when metrics were collected
  google.protobuf.Timestamp timestamp = 1;

  // vm_id these metrics belong to
  string vm_id = 2;

  // cpu metrics
  CPUMetrics cpu = 3;

  // memory metrics
  MemoryMetrics memory = 4;

  // disk metrics
  DiskMetrics disk = 5;

  // network metrics
  NetworkMetrics network = 6;

  // process metrics
  ProcessMetrics process = 7;
}

// MetricType enumerates available metric categories.
enum MetricType {
  METRIC_TYPE_UNSPECIFIED = 0;
  METRIC_TYPE_CPU = 1;
  METRIC_TYPE_MEMORY = 2;
  METRIC_TYPE_DISK = 3;
  METRIC_TYPE_NETWORK = 4;
  METRIC_TYPE_PROCESS = 5;
}

// CPUMetrics contains CPU utilization data.
message CPUMetrics {
  // usage_percent is aggregate CPU utilization (0-100 * vcpus)
  double usage_percent = 1;

  // per_vcpu_percent breaks down usage by virtual CPU
  repeated double per_vcpu_percent = 2;

  // steal_time_percent is time spent waiting for hypervisor
  double steal_time_percent = 3;

  // iowait_percent is time spent waiting for IO
  double iowait_percent = 4;
}

// MemoryMetrics contains memory utilization data.
message MemoryMetrics {
  // used_bytes is currently used memory
  int64 used_bytes = 1;

  // available_bytes is memory available for use
  int64 available_bytes = 2;

  // total_bytes is total allocated memory
  int64 total_bytes = 3;

  // swap_used_bytes is swap space in use
  int64 swap_used_bytes = 4;

  // swap_total_bytes is total swap allocated
  int64 swap_total_bytes = 5;

  // cache_bytes is filesystem cache
  int64 cache_bytes = 6;
}

// DiskMetrics contains disk IO statistics.
message DiskMetrics {
  // read_bytes_per_sec is current read throughput
  int64 read_bytes_per_sec = 1;

  // write_bytes_per_sec is current write throughput
  int64 write_bytes_per_sec = 2;

  // read_iops is current read operations per second
  int32 read_iops = 3;

  // write_iops is current write operations per second
  int32 write_iops = 4;

  // read_latency_ms is average read latency
  double read_latency_ms = 5;

  // write_latency_ms is average write latency
  double write_latency_ms = 6;

  // disk_usage_percent is disk space utilization (0-100)
  double disk_usage_percent = 7;
}

// NetworkMetrics contains network IO statistics.
message NetworkMetrics {
  // rx_bytes_per_sec is receive throughput
  int64 rx_bytes_per_sec = 1;

  // tx_bytes_per_sec is transmit throughput
  int64 tx_bytes_per_sec = 2;

  // rx_packets_per_sec is receive packet rate
  int64 rx_packets_per_sec = 3;

  // tx_packets_per_sec is transmit packet rate
  int64 tx_packets_per_sec = 4;

  // rx_errors_per_sec is receive error rate
  int64 rx_errors_per_sec = 5;

  // tx_errors_per_sec is transmit error rate
  int64 tx_errors_per_sec = 6;

  // rx_dropped_per_sec is dropped receive packets
  int64 rx_dropped_per_sec = 7;

  // tx_dropped_per_sec is dropped transmit packets
  int64 tx_dropped_per_sec = 8;
}

// ProcessMetrics contains process-level information.
message ProcessMetrics {
  // process_count is number of processes in the VM
  int32 process_count = 1;

  // thread_count is number of threads
  int32 thread_count = 2;

  // load_average_1m is 1-minute load average
  double load_average_1m = 3;

  // load_average_5m is 5-minute load average
  double load_average_5m = 4;

  // load_average_15m is 15-minute load average
  double load_average_15m = 5;
}

// ============================================================================
// Snapshots
// ============================================================================

// SnapshotOperationType enumerates snapshot operations.
enum SnapshotOperationType {
  SNAPSHOT_OPERATION_TYPE_UNSPECIFIED = 0;
  SNAPSHOT_OPERATION_TYPE_CREATE = 1;   // Create new snapshot
  SNAPSHOT_OPERATION_TYPE_LIST = 2;     // List existing snapshots
  SNAPSHOT_OPERATION_TYPE_RESTORE = 3;  // Restore from snapshot
  SNAPSHOT_OPERATION_TYPE_DELETE = 4;   // Delete a snapshot
  SNAPSHOT_OPERATION_TYPE_INFO = 5;     // Get snapshot details
}

// SnapshotRequest initiates a snapshot operation.
message SnapshotRequest {
  // vm_id is the target VM
  string vm_id = 1;

  // operation specifies what to do
  SnapshotOperationType operation = 2;

  // snapshot_id is required for RESTORE, DELETE, and INFO operations
  string snapshot_id = 3;

  // name is the desired name for CREATE operations
  string name = 4;

  // description provides additional context
  string description = 5;

  // quiesce freezes the guest's filesystems through its guest agent for a
  // disk-only snapshot; the snapshot fails when the guest agent cannot.
  bool quiesce = 6;

  // disk_only takes the disks only of a running VM: no memory saved and no
  // pause. A revert boots the VM from the snapshot's disks. A stopped VM's
  // snapshot is disk-only anyway. Needs the agent feature "snapshot_options";
  // an older agent ignores it and saves the memory.
  bool disk_only = 7;
}

// SnapshotResponse reports the result of a snapshot operation.
message SnapshotResponse {
  // success indicates if the operation succeeded
  bool success = 1;

  // operation that was performed
  SnapshotOperationType operation = 2;

  // snapshot contains details for CREATE, LIST, INFO operations
  SnapshotInfo snapshot = 3;

  // snapshots list for LIST operations
  repeated SnapshotInfo snapshots = 4;

  // error details if failed
  ErrorResponse error = 5;
}

// SnapshotInfo describes a single snapshot.
message SnapshotInfo {
  // snapshot_id is the unique identifier
  string snapshot_id = 1;

  // name of the snapshot
  string name = 2;

  // description of the snapshot
  string description = 3;

  // created_at timestamp
  google.protobuf.Timestamp created_at = 4;

  // size_bytes is the snapshot size
  int64 size_bytes = 5;

  // vm_state was the VM state when snapshot was taken
  VMState vm_state = 6;

  // parent_id is the parent snapshot (for chains)
  string parent_id = 7;
}

// ============================================================================
// Network Configuration
// ============================================================================

// VMNetworkConfig defines network settings for a VM.
message VMNetworkConfig {
  // interfaces list of network interfaces
  repeated NetworkInterface interfaces = 1;

  // firewall_rules to apply
  repeated FirewallRule firewall_rules = 2;

  // bandwidth_limits for traffic shaping
  BandwidthLimit bandwidth_limits = 3;

  // port_forwards (DNAT) to apply
  repeated PortForward port_forwards = 4;

  // firewall_default is what happens to inbound traffic no rule matched once
  // the VM has rules: "accept", or "drop" (also when empty).
  string firewall_default = 5;

  // block_smtp rejects new outbound connections to port 25 from the VM.
  bool block_smtp = 6;

  // hostname_forwards are the hostnames the node's web router sends to this
  // VM's primary address. An agent without the "hostname_proxy" feature
  // ignores them; the panel does not send any to such a node.
  repeated HostnameForward hostname_forwards = 7;
}

// HostnameForward routes one hostname, arriving on the node's publish address,
// to the VM: plain HTTP by its Host header, TLS by its SNI, passed through
// without the node holding any certificate.
message HostnameForward {
  string hostname = 1;
  // http_port and https_port are the VM's ports; 0 leaves that one out.
  int32 http_port = 2;
  int32 https_port = 3;
}

// PortForward defines a DNAT port-forwarding rule.
message PortForward {
  // external_port on the host
  int32 external_port = 1;

  // internal_port on the VM
  int32 internal_port = 2;

  // protocol (tcp or udp); empty = tcp
  string protocol = 3;

  // source_cidr restricts the source; empty/"0.0.0.0/0" = any
  string source_cidr = 4;
}

// NetworkInterface defines a single network interface.
message NetworkInterface {
  // name is the interface identifier (e.g., "eth0")
  string name = 1;

  // type of interface (bridge, macvtap, etc.)
  NetworkInterfaceType type = 2;

  // bridge_name is the host bridge for bridge type
  string bridge_name = 3;

  // mac_address is the interface MAC (empty = auto-generate)
  string mac_address = 4;

  // ip_address assigned to this interface
  string ip_address = 5;

  // netmask CIDR prefix length (e.g. 24)
  int32 netmask = 6;

  // gateway for the assigned IP
  string gateway = 7;

  // use_dhcp if true, configure via DHCP instead of static
  bool use_dhcp = 8;

  // anti_spoofing enables anti-IP hijacking protection (iptables + ebtables + nwfilter)
  bool anti_spoofing = 9;

  // vlan_id is the 802.1Q VLAN tag for this interface (0 = untagged)
  int32 vlan_id = 10;

  // ipv6_prefix is the prefix routed to this VM (e.g. "2001:db8:20:5::/64").
  // Empty = no IPv6. The host routes it to the guest's EUI-64 link-local
  // address and the guest binds ipv6_address with ipv6_gateway as its default.
  string ipv6_prefix = 11;
  string ipv6_address = 12;
  string ipv6_gateway = 13;
  repeated string ipv6_dns = 14;

  // dns are the resolvers the guest is given for this interface's addresses.
  // Empty keeps the agent's built-in ones. Honoured by agents with the
  // "guest_dns" feature.
  repeated string dns = 15;

  // dhcp_server asks the node to answer DHCP for ip_address, to the VM's card
  // on bridge_name only ("dhcp_server" feature). It never hands out an
  // address the panel did not send.
  bool dhcp_server = 16;

  // ipv6_extra are further addresses inside ipv6_prefix the guest holds,
  // without a prefix length ("ipv6_extra" feature).
  repeated string ipv6_extra = 17;
}

// NetworkInterfaceType enumerates network interface types.
enum NetworkInterfaceType {
  NETWORK_INTERFACE_TYPE_UNSPECIFIED = 0;
  NETWORK_INTERFACE_TYPE_BRIDGE = 1;
  NETWORK_INTERFACE_TYPE_MACVTAP = 2;
  NETWORK_INTERFACE_TYPE_USER = 3;
  NETWORK_INTERFACE_TYPE_PASSTHROUGH = 4;
}

// FirewallRule defines a single firewall rule.
message FirewallRule {
  // direction of traffic
  FirewallDirection direction = 1;

  // action to take
  FirewallAction action = 2;

  // protocol (tcp, udp, icmp, or all)
  string protocol = 3;

  // source_cidr is the source IP range
  string source_cidr = 4;

  // dest_port is the destination port or range (e.g., "80", "1000-2000")
  string dest_port = 5;

  // priority of the rule (lower = higher priority)
  int32 priority = 6;

  // description of the rule
  string description = 7;

  // reject answers the sender (TCP reset / ICMP unreachable) instead of
  // dropping silently. Sent with action DENY, so an agent that predates it
  // still drops.
  bool reject = 8;

  // icmp_type narrows an icmp rule to one type ("echo-request", "8", "8/0").
  string icmp_type = 9;

  // log writes matching packets to the node's kernel log, rate-limited.
  bool log = 10;

  // family limits the rule to "v4" or "v6"; empty applies it to both.
  string family = 11;
}

// FirewallDirection enumerates traffic directions.
enum FirewallDirection {
  FIREWALL_DIRECTION_UNSPECIFIED = 0;
  FIREWALL_DIRECTION_INBOUND = 1;
  FIREWALL_DIRECTION_OUTBOUND = 2;
}

// FirewallAction enumerates firewall actions.
enum FirewallAction {
  FIREWALL_ACTION_UNSPECIFIED = 0;
  FIREWALL_ACTION_ALLOW = 1;
  FIREWALL_ACTION_DENY = 2;
  FIREWALL_ACTION_REJECT = 3;
}

// BandwidthLimit defines traffic shaping parameters.
message BandwidthLimit {
  // ingress_rate_mbps is incoming bandwidth limit
  int32 ingress_rate_mbps = 1;

  // egress_rate_mbps is outgoing bandwidth limit
  int32 egress_rate_mbps = 2;

  // burst_size_mb allows temporary bursts
  int32 burst_size_mb = 3;
}

// NetworkConfigRequest applies network configuration to a VM.
message NetworkConfigRequest {
  // vm_id is the target VM
  string vm_id = 1;

  // config to apply
  VMNetworkConfig config = 2;

  // replace_all if true, replaces entire config; if false, merges
  bool replace_all = 3;

  // configure_guest asks the agent to also rewrite the guest OS's network
  // configuration (address/prefix/gateway of the primary interface). Set only
  // when the address itself changed; host-side rule syncs leave it false.
  bool configure_guest = 4;
}

// NetworkConfigResponse reports the result of network configuration.
message NetworkConfigResponse {
  // success indicates if configuration was applied
  bool success = 1;

  // applied_interfaces shows what was configured
  repeated NetworkInterface applied_interfaces = 2;

  // error details if failed
  ErrorResponse error = 3;

  // guest_pending is set when configure_guest could not reach the running
  // guest: the host side is applied, the guest keeps its old addresses until
  // it is stopped and started (or its guest agent answers), and nothing was
  // restarted.
  string guest_pending = 4;

  // guest_retry says the agent applies the change itself later (when the
  // guest agent answers or the VM is started); false means it is left to the
  // owner, e.g. a guest that does not use systemd-networkd.
  bool guest_retry = 5;

  // hostname_error says why the node is not routing the VM's hostnames (for
  // instance port 80 is taken on it); empty when it is, or when there are none.
  string hostname_error = 6;
}

// ============================================================================
// Storage Configuration
// ============================================================================

// StorageConfig defines additional storage for a VM.
message StorageConfig {
  // primary_disk configuration
  DiskConfig primary_disk = 1;

  // additional_volumes to attach
  repeated DiskConfig additional_volumes = 2;
}

// DiskConfig defines a single disk or volume.
message DiskConfig {
  // id is the unique identifier for this disk
  string id = 1;

  // size_gb is the disk size
  int64 size_gb = 2;

  // format is the disk image format (qcow2, raw, etc.)
  DiskFormat format = 3;

  // backend is the storage backend type
  StorageBackend backend = 4;

  // backing_image is a base image for copy-on-write (optional)
  string backing_image = 5;

  // mount_point in the guest (for additional volumes)
  string mount_point = 6;
}

// DiskFormat enumerates supported disk formats.
enum DiskFormat {
  DISK_FORMAT_UNSPECIFIED = 0;
  DISK_FORMAT_QCOW2 = 1;
  DISK_FORMAT_RAW = 2;
  DISK_FORMAT_VMDK = 3;
  DISK_FORMAT_VDI = 4;
}

// StorageBackend enumerates storage backends.
enum StorageBackend {
  STORAGE_BACKEND_UNSPECIFIED = 0;
  STORAGE_BACKEND_LOCAL = 1;
  STORAGE_BACKEND_ZFS = 2;
  STORAGE_BACKEND_LVM = 3;
  STORAGE_BACKEND_CEPH = 4;
  STORAGE_BACKEND_NFS = 5;
}

// ============================================================================
// VNC Proxy
// ============================================================================

// VNCProxyRequest initiates a VNC proxy for console access.
message VNCProxyRequest {
  // vm_id is the target VM
  string vm_id = 1;

  // websocket_port to bind (0 = auto-assign)
  int32 websocket_port = 2;

  // expiry_seconds for the proxy session (0 = no expiry)
  int32 expiry_seconds = 3;

  // one_time if true, proxy stops after first connection
  bool one_time = 4;
}

// VNCProxyResponse provides VNC connection details.
message VNCProxyResponse {
  // success indicates if proxy was started
  bool success = 1;

  // websocket_url is the WebSocket endpoint for noVNC
  string websocket_url = 2;

  // websocket_port the proxy is listening on
  int32 websocket_port = 3;

  // token for authentication
  string token = 4;

  // expires_at when the session expires
  google.protobuf.Timestamp expires_at = 5;

  // error details if failed
  ErrorResponse error = 6;
}

// ============================================================================
// Common Messages
// ============================================================================

// ErrorResponse provides detailed error information.
message ErrorResponse {
  // code is a machine-readable error code
  ErrorCode code = 1;

  // message is a human-readable description
  string message = 2;

  // details contains additional error context
  map<string, string> details = 3;

  // retryable indicates if the operation can be retried
  bool retryable = 4;
}

// ErrorCode enumerates possible error conditions.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INTERNAL = 1;           // Internal server error
  ERROR_CODE_INVALID_ARGUMENT = 2;   // Invalid request parameter
  ERROR_CODE_NOT_FOUND = 3;          // Resource not found
  ERROR_CODE_ALREADY_EXISTS = 4;     // Resource already exists
  ERROR_CODE_PERMISSION_DENIED = 5;  // Insufficient permissions
  ERROR_CODE_RESOURCE_EXHAUSTED = 6; // Resource limits reached
  ERROR_CODE_UNAVAILABLE = 7;        // Service temporarily unavailable
  ERROR_CODE_TIMEOUT = 8;            // Operation timed out
  ERROR_CODE_CONFLICT = 9;           // State conflict
  ERROR_CODE_UNAUTHENTICATED = 10;   // Authentication required
}

// ============================================================================
// Node Information
// ============================================================================

// GetNodeInfoRequest requests detailed system information about a node.
message GetNodeInfoRequest {
  // Empty request - node is identified by connection context
}

// GetNodeInfoResponse contains detailed system information about a node.
message GetNodeInfoResponse {
  // success indicates if the operation succeeded
  bool success = 1;

  // os_info contains operating system information
  OSInfo os_info = 2;

  // cpu_info contains CPU information
  CPUInfo cpu_info = 3;

  // memory_total_bytes is the total system memory
  int64 memory_total_bytes = 4;

  // disk_total_bytes is the total disk space
  int64 disk_total_bytes = 5;

  // libvirt_version is the installed libvirt version
  string libvirt_version = 6;

  // agent_commit and agent_build_time identify the build of the agent itself.
  //
  // Nodes on this fleet routinely run different revisions — a node with a long
  // export in flight is deliberately left until it finishes — and until now the
  // only way to tell was to read the binary's timestamp over SSH.
  string agent_commit = 24;
  string agent_build_time = 25;
  string agent_version = 26;

  // features names what this agent can do that an older one cannot, so the
  // panel can refuse instead of having a request silently half-done.
  // "restore_disks": creates a VM with every disk of a backup.
  repeated string features = 27;

  // agent_settings is the agent's own configuration from its environment, by
  // variable name, non-secret values only: a credential is reported as "set"
  // or left out. Empty from an agent older than the field.
  map<string, string> agent_settings = 28;

  // error details if failed
  ErrorResponse error = 7;

  // === Live metrics fields (added for real-time monitoring) ===

  // cpu_percent is the current CPU usage percentage (0-100)
  double cpu_percent = 8;

  // memory_used_bytes is the current memory usage in bytes
  int64 memory_used_bytes = 9;

  // memory_used_percent is the memory usage percentage (0-100)
  double memory_used_percent = 10;

  // disk_used_bytes is the current disk usage in bytes
  int64 disk_used_bytes = 11;

  // disk_used_percent is the disk usage percentage (0-100)
  double disk_used_percent = 12;

  // network_rx_bytes_per_sec is the network receive rate
  int64 network_rx_bytes_per_sec = 13;

  // network_tx_bytes_per_sec is the network transmit rate
  int64 network_tx_bytes_per_sec = 14;

  // disk_read_bytes_per_sec is the disk read rate
  int64 disk_read_bytes_per_sec = 15;

  // disk_write_bytes_per_sec is the disk write rate
  int64 disk_write_bytes_per_sec = 16;

  // load_avg_1 is the 1-minute load average
  double load_avg_1 = 17;

  // load_avg_5 is the 5-minute load average
  double load_avg_5 = 18;

  // load_avg_15 is the 15-minute load average
  double load_avg_15 = 19;

  // running_vm_count is the number of running VMs
  int32 running_vm_count = 20;

  // available_cpus is the number of available CPU cores
  int32 available_cpus = 21;

  // available_memory_mb is the available memory in MB
  int64 available_memory_mb = 22;

  // available_disk_gb is the available disk space in GB
  int64 available_disk_gb = 23;
}

// OSInfo contains operating system information.
message OSInfo {
  // os_name is the operating system name (e.g., "Ubuntu", "CentOS")
  string os_name = 1;

  // os_version is the OS version (e.g., "22.04", "8")
  string os_version = 2;

  // kernel_version is the kernel version string
  string kernel_version = 3;

  // architecture is the system architecture (e.g., "x86_64", "aarch64")
  string architecture = 4;
}

// CPUInfo contains CPU information.
message CPUInfo {
  // model is the CPU model name
  string model = 1;

  // cores is the number of CPU cores
  int32 cores = 2;

  // threads is the number of CPU threads
  int32 threads = 3;

  // architecture is the CPU architecture
  string architecture = 4;

  // flags are the CPU feature flags
  repeated string flags = 5;
}

// ============================================================================
// Disk Import
// ============================================================================

// DiskImportRequest requests importing a disk image for a VM.
message DiskImportRequest {
  // vm_id is the target VM
  string vm_id = 1;

  // source_path is the path to the source disk image
  string source_path = 2;

  // target_path is the destination path for the disk image
  string target_path = 3;

  // format is the disk image format (qcow2, raw, vmdk, etc.)
  string format = 4;

  // action specifies how to handle the disk (copy, move, symlink)
  string action = 5;
}

// DiskImportResponse reports the result of a disk import operation.
message DiskImportResponse {
  // success indicates if the import succeeded
  bool success = 1;

  // vm_id of the affected VM
  string vm_id = 2;

  // imported_path is the final path where the disk was imported
  string imported_path = 3;

  // size_bytes is the size of the imported disk
  int64 size_bytes = 4;

  // error details if failed
  ErrorResponse error = 5;
}

// BackupDiskRequest requests a compressed disk backup of a VM to object storage.
message BackupDiskRequest {
  // vm_id is the VM whose primary disk should be backed up
  string vm_id = 1;

  // destination_key is the object storage key to upload the backup to
  string destination_key = 2;

  // compress enables qcow2 compression of the exported image
  bool compress = 3;

  // object_store is where to upload. Unset means the store in the node's own
  // environment file, which is all an older panel could use.
  ObjectStore object_store = 4;

  // compression is "gzip" (zlib), "zstd" or "none". Empty means zlib, which is
  // what an older agent always uses.
  string compression = 5;

  // all_disks backs up every disk of the VM, not only the primary one. Each
  // disk after the first is stored beside destination_key.
  bool all_disks = 6;

  // checkpoint names the libvirt checkpoint this backup creates, so a later
  // backup can copy only what changed after it. Empty: no checkpoint.
  string checkpoint = 7;

  // incremental_from is the checkpoint of the backup this one builds on.
  // Empty asks for a full backup. The agent falls back to a full one when the
  // checkpoint is gone or the node cannot, and says so in mode_note.
  string incremental_from = 8;
}

// BackupDiskFile is one disk of a backup.
message BackupDiskFile {
  // target is the disk's device in the VM: vda, vdb...
  string target = 1;

  // key is the object storage key of the disk's exported image.
  string key = 2;

  // size_bytes is the size of the exported image.
  int64 size_bytes = 3;

  // checksum is the SHA256 (hex) of the exported image.
  string checksum = 4;

  // virtual_size_bytes is the disk's size as the guest sees it.
  int64 virtual_size_bytes = 5;

  // path is where the disk is on the node (set on a VM restored as a new one).
  string path = 6;

  // layers are the images an incremental backup's disk is built on, the full
  // backup first; key is the top. Sent only to an agent with
  // "incremental_backup": an older one would restore the top alone.
  repeated BackupLayer layers = 7;

  // encryption_key_id is the key the stored image was encrypted with; empty
  // when it was stored in the clear. size_bytes and checksum are the plain
  // image's, as before.
  string encryption_key_id = 8;
}

// BackupLayer is one stored image of a chain of backups.
message BackupLayer {
  string key = 1;
  // checksum is the SHA256 (hex) recorded when it was stored.
  string checksum = 2;
}

// BackupDiskResponse reports the result of a disk backup.
message BackupDiskResponse {
  // success indicates if the backup+upload succeeded
  bool success = 1;

  // object_key is the storage key the disk was uploaded to
  string object_key = 2;

  // size_bytes is the size of the uploaded backup image
  int64 size_bytes = 3;

  // checksum is the SHA256 (hex) of the uploaded image
  string checksum = 4;

  // error details if failed
  ErrorResponse error = 5;

  // used_request_store is true when the upload went to the request's
  // object_store. False from an agent that predates the field: it used its own
  // environment file, and the panel must not assume where the object is.
  bool used_request_store = 6;

  // disks lists every disk exported, primary first. Empty from an agent that
  // backs up the primary disk only.
  repeated BackupDiskFile disks = 7;

  // compression is what the export used. Empty from an older agent (zlib).
  string compression = 8;

  // consistency says how the copy was taken: "stopped" (VM off), "frozen"
  // (guest file systems frozen during a disk snapshot), "crash" (disk snapshot
  // without a freeze) or "live" (read while the VM wrote to it). Empty from an
  // older agent, which always read live.
  string consistency = 9;

  // mode is "full" or "incremental". Empty from an older agent: full.
  string mode = 10;

  // checkpoint is the checkpoint created, empty when none was.
  string checkpoint = 11;

  // mode_note says why the backup is full when incremental was asked, or why
  // no checkpoint was made.
  string mode_note = 12;
}

// RestoreDiskRequest requests restoring a VM's primary disk from a backup object.
message RestoreDiskRequest {
  // vm_id is the VM whose primary disk should be overwritten
  string vm_id = 1;

  // source_key is the object storage key of the backup qcow2 to restore
  string source_key = 2;

  // expected_checksum is the SHA256 (hex) recorded when the backup was taken;
  // the agent aborts if the downloaded object does not match
  string expected_checksum = 3;

  // object_store is where to download from. Unset means the store in the
  // node's own environment file.
  ObjectStore object_store = 4;

  // disks restores every disk of a backup of several, each onto the VM's disk
  // with the same target. When set, source_key is left empty, so an agent too
  // old to restore several refuses instead of restoring only the first.
  repeated BackupDiskFile disks = 5;
}

// ObjectStore is where backups are kept and the credentials to use it. The
// panel sends it with each request that reads or writes backups and images, so
// a node needs no storage keys of its own.
message ObjectStore {
  // endpoint is the store's address. Empty means the provider's default for
  // the region.
  string endpoint = 1;
  string region = 2;
  string bucket = 3;
  string access_key = 4;
  string secret_key = 5;

  // plain_http reaches an endpoint given without a scheme over HTTP instead of
  // HTTPS.
  bool plain_http = 6;

  // kind is "" or "s3" (the fields above), "sftp" or "path". The other kinds
  // are sent only to an agent with "backup_targets": an older one ignores
  // them and would use its own store.
  string kind = 7;
  SFTPStore sftp = 8;

  // path is, for kind "path", a directory on a file system mounted on the
  // node (NFS, CIFS or a local disk), never on its root file system.
  string path = 9;

  // encryption is the key a backup written to this store is encrypted with
  // before it leaves the node. Unset: written as it is. Used by an agent with
  // "backup_encryption"; an older one ignores it and writes in the clear.
  BackupKey encryption = 10;

  // decryption_keys are the keys the store's backups may be encrypted with;
  // each file names its own. A file stored in the clear reads as it is.
  repeated BackupKey decryption_keys = 11;
}

// BackupKey is one of a backup destination's encryption keys.
message BackupKey {
  // id is the key's UUID, written into every file it encrypts.
  string id = 1;
  // key is 32 bytes of AES-256 key material.
  bytes key = 2;
}

// SFTPStore is an SSH server backups are copied to.
message SFTPStore {
  string host = 1;
  int32 port = 2;
  string user = 3;
  // password or private_key (PEM), one of them.
  string password = 4;
  string private_key = 5;
  // host_key is the server's public key ("ssh-ed25519 AAAA..."); a server
  // presenting any other key is refused.
  string host_key = 6;
  // path is the directory on the server backups go under.
  string path = 7;
}

message DeleteBackupFilesRequest {
  ObjectStore object_store = 1;
  repeated string keys = 2;
}

message DeleteBackupFilesResponse {
  // deleted are the keys removed; missing were not there.
  repeated string deleted = 1;
  repeated string missing = 2;
  ErrorResponse error = 3;
}

// TestObjectStoreRequest asks the node to prove it can use an object store.
message TestObjectStoreRequest {
  ObjectStore object_store = 1;

  // key is the object to write, read back and delete.
  string key = 2;

  // expect_keys must already be there, as this node sees the store: a
  // backup about to be restored on it. Ignored by an agent older than
  // "backup_targets".
  repeated string expect_keys = 3;
}

message TestObjectStoreResponse {
  bool success = 1;

  // error names the step that failed (connect, write, read or delete).
  ErrorResponse error = 2;
}

// RestoreDiskResponse reports the result of a disk restore.
message RestoreDiskResponse {
  bool success = 1;
  // bytes_restored is the size of the restored image written to the disk
  int64 bytes_restored = 2;
  ErrorResponse error = 3;
}

// ============================================================================
// Storage Volume Provisioning
// ============================================================================

// CreateStorageVolumeRequest provisions a new volume in a storage pool.
message CreateStorageVolumeRequest {
  // pool_path is the pool's backing identifier: a directory for dir/file pools,
  // an LVM volume group for lvm pools, or a ZFS dataset for zfs pools.
  string pool_path = 1;

  // name is the volume name (a file extension is added for dir/file pools)
  string name = 2;

  // format is "qcow2" or "raw" (used by dir/file pools only)
  string format = 3;

  // size_gb is the size of the volume in GB
  int64 size_gb = 4;

  // pool_type selects the provisioning backend: "dir"/"file" (qemu-img),
  // "lvm" (lvcreate), or "zfs" (zfs create -V). Empty defaults to dir.
  string pool_type = 5;
}

// CreateStorageVolumeResponse reports the provisioned volume.
message CreateStorageVolumeResponse {
  bool success = 1;
  // path is the absolute path of the created volume on the node
  string path = 2;
  // actual_size_bytes is the on-disk size after creation
  int64 actual_size_bytes = 3;
  ErrorResponse error = 4;
}

// DeleteStorageVolumeRequest removes a provisioned volume.
message DeleteStorageVolumeRequest {
  // path is the absolute path/device of the volume to delete
  string path = 1;

  // pool_type selects the removal backend (dir/file=rm, lvm=lvremove, zfs=destroy)
  string pool_type = 2;

  // pool_path is the pool the volume must live in: for an LVM pool its volume
  // group ("vg/thinpool" for a thin pool). A logical volume outside it is refused.
  string pool_path = 3;
}

// DeleteStorageVolumeResponse reports the result of a volume deletion.
message DeleteStorageVolumeResponse {
  bool success = 1;
  ErrorResponse error = 2;
}

// AttachDiskRequest provisions a data disk and attaches it to a VM.
message AttachDiskRequest {
  string vm_id = 1;
  int64 size_gb = 2;
  // pool_type selects the volume backend (dir/lvm/zfs); empty = dir.
  string pool_type = 3;
  // pool_path is the backing dir / VG / dataset; empty = beside the VM's own
  // disk, else the node default image dir.
  string pool_path = 4;
  // operation_id is a required, bounded, opaque idempotency key for attach. The
  // agent persists a durable manifest keyed by this ID and returns the recorded
  // result on retry; a retry after response loss must NEVER create a second
  // volume for the same operation. Empty operation_id is rejected fail-closed.
  string operation_id = 5;
}

// AttachDiskResponse reports the attached device and its backing path.
message AttachDiskResponse {
  bool success = 1;
  string device = 2; // e.g. "vdb"
  string path = 3;   // backing volume path
  ErrorResponse error = 4;
  // operation_id echoes the idempotency key supplied in the request (if any).
  string operation_id = 5;
  // storage_disposition reports the attach verdict (ATTACHED on success;
  // PRESENT/UNKNOWN when a partial/recovered state cannot be proven attached).
  DiskStorageDisposition storage_disposition = 6;
}

// DetachDiskRequest removes a data disk from a VM.
message DetachDiskRequest {
  string vm_id = 1;
  string device = 2; // e.g. "vdb"
  string path = 3;   // backing volume path
  bool delete_volume = 4;
  string pool_type = 5; // for deletion backend; empty = dir
  // operation_id is a required, bounded, opaque idempotency key for detach. The
  // agent persists a durable manifest before any destructive action and returns
  // the recorded result on retry. Empty operation_id is rejected fail-closed.
  string operation_id = 6;
  // pool_path is the pool a logical volume being deleted must live in (see
  // DeleteStorageVolumeRequest.pool_path).
  string pool_path = 7;
}

// DetachDiskResponse reports the result of a disk detach.
message DetachDiskResponse {
  bool success = 1;
  ErrorResponse error = 2;
  // operation_id echoes the idempotency key supplied in the request (if any).
  string operation_id = 3;
  // storage_disposition reports the detach verdict (ABSENT on full cleanup;
  // ATTACHED/PRESENT/UNKNOWN when the agent cannot prove absence). delete_volume
  // must be honored: an unsafe detach yields PRESENT, never accounting-safe success.
  DiskStorageDisposition storage_disposition = 4;
}

// DefineNetworkRequest creates a managed libvirt network for a private segment.
message DefineNetworkRequest {
  string name = 1;   // unique libvirt network name
  string mode = 2;   // "isolated" (no uplink) or "nat"
  string bridge = 3; // desired bridge name; empty = agent generates one
  string cidr = 4;   // e.g. 10.20.0.0/24 — host takes the first usable address
  bool dhcp = 5;     // hand out DHCP leases on this network
}

// DefineNetworkResponse reports the created bridge.
message DefineNetworkResponse {
  bool success = 1;
  string bridge = 2; // bridge libvirt created/used
  ErrorResponse error = 3;
}

// UndefineNetworkRequest removes a managed libvirt network.
message UndefineNetworkRequest {
  string name = 1;
}

// UndefineNetworkResponse reports the result of a network removal.
message UndefineNetworkResponse {
  bool success = 1;
  ErrorResponse error = 2;
}

// MigrateVMRequest live-migrates a domain to a destination node.
message MigrateVMRequest {
  // vm_id is the domain UUID to migrate (must exist on this source node)
  string vm_id = 1;

  // dest_uri is the destination libvirt connection URI, e.g.
  // "qemu+ssh://root@203.0.113.131/system"
  string dest_uri = 2;

  // live performs a live migration (no downtime) when true
  bool live = 3;

  // copy_storage enables full block migration (disks copied; no shared storage)
  bool copy_storage = 4;

  // migration_id names this move; the progress and abort calls use it.
  string migration_id = 5;

  // dest_address is the destination node. When set, the agent connects over
  // the migration link (dest_uri is ignored), starts the move in the
  // background and answers at once.
  string dest_address = 6;

  // disks says where each disk, and the seed image, lives on the destination.
  repeated MigrationDiskMap disks = 7;

  // bandwidth_mib_s caps the transfer, in MiB/s. 0 is no cap.
  int64 bandwidth_mib_s = 8;
}

// MigrateVMResponse reports the result of a migration.
message MigrateVMResponse {
  bool success = 1;
  string message = 2;
  ErrorResponse error = 3;
}

// SyncTemplateRequest asks the node to cache an OS template image locally.
message SyncTemplateRequest {
  // image_url is the template source (http(s) URL or an absolute path on the node)
  string image_url = 1;

  // expected_checksum, when set, is verified (sha256 hex) after download
  string expected_checksum = 2;
}

// SyncTemplateResponse reports the cached template on the node.
message SyncTemplateResponse {
  bool success = 1;
  // local_path is where the image is cached on the node
  string local_path = 2;
  // size_bytes is the cached image size
  int64 size_bytes = 3;
  // checksum is the sha256 (hex) of the cached image
  string checksum = 4;
  ErrorResponse error = 5;
}

// ============================================================================
// Live Metrics
// ============================================================================

// ============================================================================
// Storage reporting
// ============================================================================

message GetStorageReportRequest {
  // paths are the pool paths to measure. Each is measured on its own, because
  // pools on a node routinely live on different filesystems.
  repeated string paths = 1;

  // lvm_pools are LVM pools to measure and check. An agent that predates LVM
  // pools ignores them and reports none.
  repeated LVMPool lvm_pools = 2;
}

// LVMPoolCapacity is one LVM pool's state: a volume group's extents, or a
// thin pool's data and metadata use.
message LVMPoolCapacity {
  string vg = 1;
  string thin_pool = 2;
  bool exists = 3;
  // error says why the pool cannot hold VM disks (missing, not a thin pool,
  // holds the host's own system); empty when it can.
  string error = 4;
  int64 total_bytes = 5;
  int64 used_bytes = 6;
  int64 available_bytes = 7;
  // metadata_percent is a thin pool's metadata use; 0 for a thick pool.
  double metadata_percent = 8;
}

// PoolCapacity is one pool path's real filesystem usage.
message PoolCapacity {
  string path = 1;

  // exists is false when the path is missing on the node. Reported rather than
  // silently zeroed: a pool pointing at a path that is not there is a
  // misconfiguration, and zero bytes used looks like an empty pool.
  bool exists = 2;

  int64 total_bytes = 3;
  int64 used_bytes = 4;
  int64 available_bytes = 5;

  // filesystem identifies the mount backing this path, so two pools that share
  // one filesystem can be shown as sharing it rather than as independent
  // capacity that can be added up.
  string filesystem = 6;

  // problem says why the node cannot use a pool whose path exists: a shared
  // pool this node is a member of that is not mounted here. Empty when it can.
  string problem = 7;
}

// DiskLocation is a directory the node's domains actually keep disks in.
message DiskLocation {
  string path = 1;
  int32 disk_count = 2;
}

message GetStorageReportResponse {
  bool success = 1;
  repeated PoolCapacity pools = 2;

  // disk_locations covers every defined domain, including ones the panel does
  // not manage, so storage in use outside any registered pool becomes visible
  // instead of being discovered during an outage.
  repeated DiskLocation disk_locations = 3;

  ErrorResponse error = 4;

  repeated LVMPoolCapacity lvm_pools = 5;
}

// GetLiveMetricsRequest requests real-time system metrics from the node.
message GetLiveMetricsRequest {
  // Empty request - node is identified by connection context
}

// GetLiveMetricsResponse contains real-time system metrics.
message GetLiveMetricsResponse {
  // success indicates if the operation succeeded
  bool success = 1;

  // cpu_percent is the current CPU usage percentage (0-100)
  double cpu_percent = 2;

  // memory_used_bytes is the current memory usage in bytes
  int64 memory_used_bytes = 3;

  // memory_total_bytes is the total system memory in bytes
  int64 memory_total_bytes = 4;

  // memory_used_percent is the memory usage percentage (0-100)
  double memory_used_percent = 5;

  // disk_used_bytes is the current disk usage in bytes
  int64 disk_used_bytes = 6;

  // disk_total_bytes is the total disk space in bytes
  int64 disk_total_bytes = 7;

  // disk_used_percent is the disk usage percentage (0-100)
  double disk_used_percent = 8;

  // network_rx_bytes_per_sec is the network receive rate in bytes/sec
  int64 network_rx_bytes_per_sec = 9;

  // network_tx_bytes_per_sec is the network transmit rate in bytes/sec
  int64 network_tx_bytes_per_sec = 10;

  // disk_read_bytes_per_sec is the disk read rate in bytes/sec
  int64 disk_read_bytes_per_sec = 11;

  // disk_write_bytes_per_sec is the disk write rate in bytes/sec
  int64 disk_write_bytes_per_sec = 12;

  // load_avg_1 is the 1-minute load average
  double load_avg_1 = 13;

  // load_avg_5 is the 5-minute load average
  double load_avg_5 = 14;

  // load_avg_15 is the 15-minute load average
  double load_avg_15 = 15;

  // running_vm_count is the number of running VMs
  int32 running_vm_count = 16;

  // available_cpus is the number of available CPU cores
  int32 available_cpus = 17;

  // available_memory_mb is the available memory in MB
  int64 available_memory_mb = 18;

  // available_disk_gb is the available disk space in GB
  int64 available_disk_gb = 19;

  // conntrack_count and conntrack_max report the kernel's connection tracking
  // table. This is a hard ceiling, not a soft metric: once the table is full the
  // node silently refuses NEW connections for every tenant on it, and the
  // agent's own RPCs start timing out. A node was found pinned at 100% on
  // 2026-08-08 while CPU, memory and bandwidth all looked healthy — which is
  // exactly why it belongs next to them.
  int64 conntrack_count = 21;
  int64 conntrack_max = 22;

  // firewall_enforcement says whether bridged guest traffic passes through the
  // node's iptables rules: "enforced" or "off". Empty means an agent that does
  // not report it, which the panel must show as unknown and never as enforced.
  string firewall_enforcement = 23;

  // nat_address is the one node address port forwards are published on. Empty
  // from an agent that does not scope port forwards to an address.
  string nat_address = 24;

  // guest_network_pending lists VMs whose guest still waits for an address
  // change (see NetworkConfigResponse.guest_pending).
  repeated string guest_network_pending = 25;

  // network_repairs counts, since the agent started, the VMs whose host rules
  // were found changed or missing and re-applied; network_repair_last says
  // which and what.
  int64 network_repairs = 26;
  string network_repair_last = 27;

  // error details if failed
  ErrorResponse error = 20;
}

// ============================================================================
// Guest connection abuse
// ============================================================================

message GetGuestConnectionsRequest {}

message GetGuestConnectionsResponse {
  bool success = 1;
  repeated GuestConnectionReport guests = 2;
  ErrorResponse error = 3;

  // null_routes is every null-route in force on the node, so the panel learns
  // of ones that expired or were edited by hand.
  repeated NullRoute null_routes = 4;
}

// ============================================================================
// VM Scanning for Import
// ============================================================================

// ScanVMsRequest requests a scan of all VMs on the node
message ScanVMsRequest {
  // scan_path is an optional custom path to scan for XML files
  string scan_path = 1;
}

// ScanVMsResponse contains the list of discovered VMs
message ScanVMsResponse {
  bool success = 1;
  repeated ScannedVM vms = 2;
  int32 total_found = 3;
  ErrorResponse error = 4;
}

// ScannedVM represents a VM discovered on the node
message ScannedVM {
  string uuid = 1;
  string name = 2;
  string hostname = 3;
  int32 cpu = 4;
  int64 memory_mb = 5;
  int32 vnc_port = 6;
  string vnc_password = 7;
  string status = 8;
  repeated ScannedDisk disks = 9;
  repeated ScannedNetwork networks = 10;
  string xml_path = 11;
}

// ScannedDisk represents a disk found on a scanned VM
message ScannedDisk {
  string source_file = 1;
  string format = 2;
  string device = 3;
  string bus = 4;
  string target_dev = 5;
  int64 size_bytes = 6;
}

// ScannedNetwork represents a network interface found on a scanned VM
message ScannedNetwork {
  string mac_address = 1;
  string bridge = 2;
  string model = 3;
  string ip_address = 4;
}

// ============================================================================
// IP probing (ARP)
// ============================================================================

// ProbeIPsRequest asks the agent to ARP-probe ip_addresses on the given bridge.
message ProbeIPsRequest {
  string bridge = 1;                 // host bridge to probe on (e.g. viifbr0)
  repeated string ip_addresses = 2;  // IPv4 addresses to probe
  int32 timeout_ms = 3;              // per-probe wait; 0 → agent default (1000ms)
}

// ProbeIPsResponse reports which probed IPs are live on the wire.
message ProbeIPsResponse {
  repeated string in_use = 1;   // IPs that answered ARP (in use by some host)
  repeated string checked = 2;  // IPs actually probed (probe attempted)
}

// ============================================================================
// Floating IPs
// ============================================================================

// FloatingIPRequest attaches or detaches a floating IP on the node. internal_ip
// and nat_mode are required for detach as well as attach, so the agent can
// reconstruct and delete the exact rules it added without keeping state.
message FloatingIPRequest {
  string floating_ip = 1;  // the public /32 that moves between VMs
  string vm_id = 2;        // VM the address is (or was) attached to
  string internal_ip = 3;  // the VM's own address, i.e. the NAT destination
  string bridge = 4;       // uplink bridge to bind the address to and GARP on
  bool attach = 5;         // true = attach, false = detach
  string nat_mode = 6;     // "inbound" (DNAT only) or "full" (DNAT + SNAT)
  // vpc_id, when set, means the VM lives in a tenant VPC. The address is then
  // configured inside that VPC's router namespace rather than on the host: the
  // host has no route to the VM's subnet at all (that is what lets tenants
  // overlap), so a host-side DNAT would have nowhere to send the packet.
  string vpc_id = 7;
  // gateway is the upstream gateway of the floating IP's pool. A VPC router
  // namespace needs it explicitly: it has no other route to the internet over
  // the public bridge.
  string gateway = 8;
}

// FloatingIPResponse reports the result of a floating IP attach/detach.
message FloatingIPResponse {
  bool success = 1;
  ErrorResponse error = 2;
}

// ============================================================================
// Tenant VPCs (router namespace per VPC)
// ============================================================================

// VPCRequest creates or removes a VPC on the node. Create is idempotent, so the
// panel can re-apply it to restore VPCs after a node reboot.
message VPCRequest {
  string vpc_id = 1;   // tenant VPC id; derives the namespace/bridge names
  string subnet = 2;   // customer-chosen CIDR, e.g. "10.0.0.0/24" (may overlap another tenant's)
  string gateway = 3;  // gateway address inside subnet, held by the router namespace
  bool create = 4;     // true = create/repair, false = remove
}

// VPCResponse reports the result and the bridge guests must attach to.
message VPCResponse {
  bool success = 1;
  string bridge = 2;        // host bridge for guest NICs (carries NO IP)
  string router_netns = 3;  // namespace holding the gateway, for diagnostics
  ErrorResponse error = 4;
}

// ============================================================================
// Quarantine
// ============================================================================

message SetQuarantineRequest {
  // mac identifies the guest interface to cut off or restore.
  string mac = 1;

  // quarantined true drops the guest's traffic, false restores it.
  bool quarantined = 2;

  // reason is recorded in the node's quarantine file so an operator reading it
  // months later knows why a guest is cut off and who to ask about it.
  string reason = 3;
}

message GetExportProgressRequest {}

// ExportProgress is one disk export in flight.
message ExportProgress {
  string vm_id = 1;

  // kind is "backup" or "image" — the same export path serves both.
  string kind = 2;

  // source_bytes is the size of the disk being read. written_bytes is the size
  // of the compressed output so far.
  //
  // The ratio of the two is NOT the completion percentage: the output is
  // compressed, so it lags the input by whatever ratio the data achieves. The
  // panel reports bytes written and elapsed time, and leaves it at that rather
  // than showing a percentage that would be wrong in a way nobody could see.
  int64 source_bytes = 3;
  int64 written_bytes = 4;

  google.protobuf.Timestamp started_at = 5;
}

message GetExportProgressResponse {
  bool success = 1;
  repeated ExportProgress exports = 2;
  ErrorResponse error = 3;
}

message SetConsoleAccessRequest {
  string vm_id = 1;

  // enabled false replaces the console password, stored and live, with one
  // nobody holds; true sets vnc_password. The console listens on the node's
  // loopback either way.
  bool enabled = 2;

  // vnc_password is the password to set when enabling, so the panel's proxy
  // can still connect. Ignored when disabling.
  string vnc_password = 3;
}

// ConsoleData is one piece of a console session.
message ConsoleData {
  // vm_id names the VM. Read only from the first message the panel sends.
  string vm_id = 1;

  // data is raw console bytes. The agent's first message carries none: it
  // means the console socket is connected.
  bytes data = 2;
}

message SetConsoleAccessResponse {
  bool success = 1;

  // vnc_port is the domain's live VNC port after the change, 0 when it has no
  // console device at all.
  int32 vnc_port = 2;

  // restart_required is true when the running domain could not take the
  // change: it was started without a console password, which cannot be added
  // while it runs, or it still holds a socket on every address. Both end when
  // it is next powered off and on.
  bool restart_required = 3;

  ErrorResponse error = 4;
}

message SetQuarantineResponse {
  bool success = 1;

  // quarantined_macs is the full list after the change, so the panel can
  // reconcile rather than assume its own view is authoritative — the file can
  // also be edited by hand on the node.
  repeated string quarantined_macs = 2;

  ErrorResponse error = 3;
}

// ============================================================================
// Agent self-update
// ============================================================================

message AgentUpdateChunk {
  // Set on the first chunk only.
  string sha256 = 1;
  string arch = 2;
  string commit = 3;
  int64 size = 4;
  bytes data = 5;
  // Ed25519 signature over the binary's digest, made offline (cmd/agent-sign).
  // First chunk only. A node with AGENT_UPDATE_PUBKEY set refuses an update
  // without a valid one; other nodes ignore it.
  bytes signature = 6;
}

message AgentUpdateResponse {
  bool success = 1;
  string message = 2;
  ErrorResponse error = 3;
}

// ============================================================================
// Host preflight
// ============================================================================

message PreflightRequest {
  // Directory storage pools the panel places disks in on this node. Empty
  // checks the node's default image directory, where disks go then.
  repeated string pool_paths = 1;
  // Bridges the node's IP pools attach VMs to.
  repeated string bridges = 2;
}

message PreflightCheck {
  string id = 1;
  string name = 2;
  // pass, warn or fail.
  string status = 3;
  string detail = 4;
  // How to fix it; empty on a pass.
  string fix = 5;
}

message PreflightResponse {
  bool success = 1;
  repeated PreflightCheck checks = 2;
  ErrorResponse error = 3;
}

// ============================================================================
// VM migration between nodes
// ============================================================================

// MigrationDiskMap is one of a VM's drives and its path on the destination.
message MigrationDiskMap {
  // target is the drive's target (vda, vdb, sda).
  string target = 1;
  string dest_path = 2;
  // copy is true for a disk whose content moves; false for the seed image,
  // which the destination already has.
  bool copy = 3;
  // expected_bytes is the source file's length, checked after an offline copy.
  int64 expected_bytes = 4;
  // source_format is the drive's format on the source and dest_format the one
  // it has here (a logical volume is raw). Empty keeps the format.
  string source_format = 5;
  string dest_format = 6;
}

message GetMigrationInfoRequest {
  string vm_id = 1;
  // peer_address, when set, is a node to try the migration link to.
  string peer_address = 2;
  // include_payload adds the VM's seed image and definition (offline moves).
  bool include_payload = 3;
}

// MigrationDiskInfo is one drive of a VM.
message MigrationDiskInfo {
  string target = 1;
  // device is "disk" or "cdrom".
  string device = 2;
  // path is the source file or device; empty for an empty drive.
  string path = 3;
  string format = 4;
  // source_type is the libvirt source: file, block, network or volume.
  string source_type = 5;
  int64 virtual_size_bytes = 6;
  // file_size_bytes is the image file's length: what an offline copy moves.
  int64 file_size_bytes = 7;
  // backing_file is set when the image sits on another image.
  string backing_file = 8;
  bool readonly = 9;
  // seed marks the VM's own cloud-init seed image.
  bool seed = 10;
  // cache is the disk's cache mode ("none", "writeback"...); empty for the
  // hypervisor's default, which is not "none".
  string cache = 11;
}

message GetMigrationInfoResponse {
  bool success = 1;
  ErrorResponse error = 2;
  // migration_public_key is this node's migration key (authorized_keys form).
  string migration_public_key = 3;
  // ssh_host_keys are this node's SSH host keys ("type base64").
  repeated string ssh_host_keys = 4;
  // ssh_proxy is what an incoming migration connection runs here
  // (virt-ssh-helper, socat or nc); empty when none is installed.
  string ssh_proxy = 5;
  string cpu_vendor = 6;
  string cpu_model = 7;
  // cpu_features is the host CPU's feature list, sorted.
  repeated string cpu_features = 8;
  string libvirt_version = 9;

  // VM, when vm_id was given.
  bool vm_found = 10;
  // vm_state is running, paused, shutoff, crashed or other.
  string vm_state = 11;
  // vm_cpu_mode is host-passthrough, host-model or custom.
  string vm_cpu_mode = 12;
  // vm_cpu_xml is the VM's CPU definition, for a compatibility check.
  string vm_cpu_xml = 13;
  repeated MigrationDiskInfo disks = 14;
  int32 snapshot_count = 15;
  // backup_running is true while a backup holds the disks on overlays.
  bool backup_running = 16;
  // bridges are the bridges the VM's interfaces attach to.
  repeated string bridges = 17;
  // seed_image is the seed's content (include_payload).
  bytes seed_image = 18;
  // domain_xml is the VM's persistent definition (include_payload).
  string domain_xml = 19;

  // Link test, when peer_address was given.
  bool link_ok = 20;
  string link_error = 21;
}

// MigrationPeer is another node this one trusts for migration.
message MigrationPeer {
  string node_id = 1;
  string address = 2;
  // public_key may log in here, from address only, for a libvirt connection.
  string public_key = 3;
  // host_keys are pinned for connections from here to address.
  repeated string host_keys = 4;
}

message SetMigrationPeersRequest {
  repeated MigrationPeer peers = 1;
}

message SetMigrationPeersResponse {
  bool success = 1;
  ErrorResponse error = 2;
}

// MigrationTargetDisk is a disk to receive.
message MigrationTargetDisk {
  string target = 1;
  // file_name is its name inside the pool directory.
  string file_name = 2;
  // virtual_size_bytes is the size it is created at (live moves).
  int64 virtual_size_bytes = 3;
  string format = 4;
}

message PrepareMigrationTargetRequest {
  string vm_id = 1;
  string migration_id = 2;
  // pool_path is the directory the disks go to.
  string pool_path = 3;
  repeated MigrationTargetDisk disks = 4;
  // create_disks creates empty images for a live copy; an offline copy
  // writes the files itself.
  bool create_disks = 5;
  bytes seed_image = 6;
  string seed_file_name = 7;
  // bridges must exist here.
  repeated string bridges = 8;
  // cpu_xml, when set, must run on this host's CPU.
  string cpu_xml = 9;
  // dry_run checks without changing anything.
  bool dry_run = 10;
  // free_bytes_needed must be free on the pool's filesystem.
  int64 free_bytes_needed = 11;
  // pool_type is "" or "dir" for a directory, "lvm" or "lvmthin" for an LVM
  // pool named by pool_path: each disk then becomes a logical volume.
  string pool_type = 12;
  // scratch_bytes_needed is room an offline copy into a logical volume needs
  // beside it: the image is fetched there, then written onto the volume.
  int64 scratch_bytes_needed = 13;
}

message PrepareMigrationTargetResponse {
  bool success = 1;
  ErrorResponse error = 2;
  // paths maps each disk target to its path here.
  map<string, string> paths = 3;
  string seed_path = 4;
  // problems say why this node cannot receive the VM.
  repeated string problems = 5;
}

message PullMigratedVMRequest {
  string vm_id = 1;
  string migration_id = 2;
  string source_address = 3;
  // disks are every drive's path here; those with copy set are copied.
  repeated MigrationDiskMap disks = 4;
  // domain_xml is the VM's definition on the source; it is defined here with
  // the paths above.
  string domain_xml = 5;
}

message PullMigratedVMResponse {
  bool success = 1;
  ErrorResponse error = 2;
}

message GetMigrationProgressRequest {
  string vm_id = 1;
  string migration_id = 2;
}

message GetMigrationProgressResponse {
  // state is running, completed, failed, cancelled, or unknown when this
  // agent has no record of the migration (it was restarted, say).
  string state = 1;
  string phase = 2;
  int64 total_bytes = 3;
  int64 processed_bytes = 4;
  string error = 5;
}

message AbortMigrationRequest {
  string vm_id = 1;
  string migration_id = 2;
}

message AbortMigrationResponse {
  bool success = 1;
  ErrorResponse error = 2;
}

message FinishMigrationTargetRequest {
  string vm_id = 1;
  string migration_id = 2;
  // commit confirms the VM; otherwise the prepared files are removed.
  bool commit = 3;
}

message FinishMigrationTargetResponse {
  bool success = 1;
  ErrorResponse error = 2;
  // vm_state is the VM's state here after a commit.
  string vm_state = 3;
  // removed are the files a rollback deleted.
  repeated string removed = 4;
}

message FinishMigrationSourceRequest {
  string vm_id = 1;
  string migration_id = 2;
  // lvm_pools are the LVM pools registered on this node: the moved VM's
  // logical volumes MaburVM created in them are removed too.
  repeated LVMPool lvm_pools = 3;
  // keep_paths are disk files on shared storage that the VM uses on its new
  // node: the same files, so they are never removed here. Sent only to an
  // agent with the "shared_storage" feature.
  repeated string keep_paths = 4;
}

message FinishMigrationSourceResponse {
  bool success = 1;
  ErrorResponse error = 2;
  repeated string removed = 3;
}

// ============================================================================
// Disk operations
// ============================================================================

message ResizeVMDiskRequest {
  string vm_id = 1;
  // target is the disk's target: vda for the primary disk, vdb... for others.
  string target = 2;
  int64 size_gb = 3;
  // lvm_pools are the registered LVM pools; a logical volume is grown only in one.
  repeated LVMPool lvm_pools = 4;
}

message ResizeVMDiskResponse {
  bool success = 1;
  ErrorResponse error = 2;
  // live is true when the running VM was given the new size at once.
  bool live = 3;
  int64 size_bytes = 4;
}

message MoveVMDiskRequest {
  string vm_id = 1;
  // move_id names this move for GetMigrationProgress and AbortMigration.
  string move_id = 2;
  string target = 3;
  // dest_pool_type and dest_pool_path name the pool the disk goes to, as
  // pool_type and pool_path do on VMCommandRequest.
  string dest_pool_type = 4;
  string dest_pool_path = 5;
  // lvm_pools are the registered LVM pools: the old disk is removed only from
  // one, and only when MaburVM created it.
  repeated LVMPool lvm_pools = 6;
}

message MoveVMDiskResponse {
  bool success = 1;
  ErrorResponse error = 2;
  // live is true for a block copy of a running VM.
  bool live = 3;
  // dest_path is where the disk will be.
  string dest_path = 4;
}

message ListOrphanDisksRequest {
  // dir_pools are the directory pools to look in (their own files only).
  repeated string dir_pools = 1;
  repeated LVMPool lvm_pools = 2;
}

// OrphanDisk is a disk file or logical volume no domain uses.
message OrphanDisk {
  string path = 1;
  // kind is "file" or "lv".
  string kind = 2;
  int64 size_bytes = 3;
  // modified_unix is a file's modification time; 0 for a volume.
  int64 modified_unix = 4;
  // reason says what it looks like: a VM disk, a backup left mid-way...
  string reason = 5;
  // vm_id is the VM its name says it belonged to, when it names one.
  string vm_id = 6;
  // maburvm is true for a name MaburVM gives, or a volume it tagged.
  bool maburvm = 7;
  // pool is the pool directory, or vg[/thin pool], it is in.
  string pool = 8;
}

message ListOrphanDisksResponse {
  bool success = 1;
  ErrorResponse error = 2;
  repeated OrphanDisk disks = 3;
}

message DeleteOrphanDiskRequest {
  string path = 1;
  // size_bytes and modified_unix are what the listing showed; something that
  // changed since is kept.
  int64 size_bytes = 2;
  int64 modified_unix = 3;
  repeated string dir_pools = 4;
  repeated LVMPool lvm_pools = 5;
  // allow_foreign also removes a volume or file MaburVM did not make; the
  // operator confirmed it.
  bool allow_foreign = 6;
}

message DeleteOrphanDiskResponse {
  bool success = 1;
  ErrorResponse error = 2;
}

// ImageChunk is part of a PutImage upload. The first names the file (name,
// sha256 and size_bytes); every chunk may carry data.
message ImageChunk {
  string name = 1;
  string sha256 = 2;
  int64 size_bytes = 3;
  bytes data = 4;
}

message PutImageResponse {
  bool success = 1;
  ErrorResponse error = 2;
  // local_path is where the file is kept on this node.
  string local_path = 3;
}

// ============================================================================
// Network cards and VLAN bridges
// ============================================================================

enum NICAction {
  NIC_ACTION_UNSPECIFIED = 0;
  // NIC_ACTION_LIST changes nothing and returns the cards.
  NIC_ACTION_LIST = 1;
  // NIC_ACTION_ATTACH adds a card with mac_address on bridge.
  NIC_ACTION_ATTACH = 2;
  // NIC_ACTION_DETACH removes the card with mac_address.
  NIC_ACTION_DETACH = 3;
  // NIC_ACTION_SET_MAC gives the card with mac_address the MAC new_mac_address.
  NIC_ACTION_SET_MAC = 4;
}

message ConfigureNICRequest {
  string vm_id = 1;
  NICAction action = 2;
  string mac_address = 3;
  string bridge = 4;
  string new_mac_address = 5;
  // anti_spoofing gives an added card libvirt's anti-spoofing filter, pinned
  // to ip_address (the one address the card is given).
  bool anti_spoofing = 6;
  string ip_address = 7;
}

// VMNIC is one of a VM's network cards as its definition has it.
message VMNIC {
  string mac_address = 1;
  string bridge = 2;
  string model = 3;
  // tap is the host device while the VM runs; empty otherwise.
  string tap = 4;
}

message ConfigureNICResponse {
  bool success = 1;
  ErrorResponse error = 2;
  repeated VMNIC nics = 3;
  // live says the change reached the running VM; false means it waits for
  // the VM's next start (or the VM is off).
  bool live = 4;
  // note says, in words for the VM's page, what still has to happen.
  string note = 5;
}

message VLANBridge {
  string bridge = 1;
  string uplink = 2;
}

message SetVLANBridgesRequest {
  repeated VLANBridge bridges = 1;
  // use_environment drops what the panel set and goes back to
  // MABURVM_VLAN_BRIDGES in the agent's environment.
  bool use_environment = 2;
}

message VLANBridgeStatus {
  string bridge = 1;
  string uplink = 2;
  // problem says why VLANs cannot work on it now; empty when they can.
  string problem = 3;
  bool filtering = 4;
}

message SetVLANBridgesResponse {
  bool success = 1;
  ErrorResponse error = 2;
  repeated VLANBridgeStatus bridges = 3;
  // from_environment says the list in force came from the environment.
  bool from_environment = 4;
}

// ============================================================================
// Shared storage pools
// ============================================================================

// SetSharedPoolRequest makes this node a member of a shared pool, or removes
// it. As a member the node refuses to write under the pool's path unless the
// pool's marker file is there (an unmounted path is the local disk underneath),
// and defines disks in it with the host cache bypassed.
message SetSharedPoolRequest {
  string pool_id = 1;
  // kind is "nfs" (the agent mounts server:export at the pool's fixed path
  // with a systemd mount unit) or "mounted" (the operator mounts it at path).
  string kind = 2;
  // path is the directory of a "mounted" pool; ignored for "nfs".
  string path = 3;
  string nfs_server = 4;
  string nfs_export = 5;
  string mount_options = 6;
  // remove takes the node out: refused while a VM here has a disk in the pool.
  // An "nfs" pool is then unmounted and its unit removed.
  bool remove = 7;
}

message SetSharedPoolResponse {
  bool success = 1;
  ErrorResponse error = 2;
  // path is where the pool is on this node.
  string path = 3;
}

// SharedPoolTokenRequest writes, reads or removes one small file directly
// under a shared pool's path: how the panel proves two nodes see the same
// storage (one writes a random token, the others read it back).
message SharedPoolTokenRequest {
  string path = 1;
  // name starts with ".maburvm-".
  string name = 2;
  // op is "write", "read" or "remove".
  string op = 3;
  string content = 4;
}

message SharedPoolTokenResponse {
  bool success = 1;
  ErrorResponse error = 2;
  bool exists = 3;
  string content = 4;
}

// ============================================================================
// VMs recovered onto another node
// ============================================================================

message SetFencedVMsRequest {
  // vm_ids is the whole list; a VM left out is no longer fenced.
  repeated string vm_ids = 1;
}

// FencedVM is what this node still has of a VM that now lives elsewhere.
message FencedVM {
  string vm_id = 1;
  // defined is false when nothing of the VM is defined here.
  bool defined = 2;
  // state is "running", "paused", "shutoff"...
  string state = 3;
  repeated FencedDisk disks = 4;
}

message FencedDisk {
  string target = 1;
  string path = 2;
  int64 size_bytes = 3;
  // shared: in a shared pool, so never removed from here.
  bool shared = 4;
}

message SetFencedVMsResponse {
  bool success = 1;
  ErrorResponse error = 2;
  repeated FencedVM vms = 3;
}

message RemoveFencedVMRequest {
  string vm_id = 1;
  // force_stop powers the copy off first when it runs here. Without it a
  // running copy is refused.
  bool force_stop = 2;
  repeated LVMPool lvm_pools = 3;
}

message RemoveFencedVMResponse {
  bool success = 1;
  ErrorResponse error = 2;
  repeated string removed = 3;
  repeated string kept = 4;
}
