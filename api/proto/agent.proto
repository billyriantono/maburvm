syntax = "proto3";

package agent;

option go_package = "github.com/maburvm/maburvm/internal/shared/grpc/pb;pb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// ============================================================================
// NodeAgent Service - Main gRPC service for panel-agent communication
// ============================================================================

// NodeAgent is the primary service for communication between the MaburVM Panel
// and Node Agents. It handles node registration, heartbeat monitoring,
// VM lifecycle management, metrics streaming, and network configuration.
service NodeAgent {
  // RegisterNode handles initial node registration when an agent connects
  // to the panel for the first time. The panel assigns a node ID and returns
  // authentication credentials for subsequent requests.
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);

  // Heartbeat establishes a bidirectional streaming connection for health
  // monitoring. Both panel and agent can send heartbeats to detect
  // connectivity issues and exchange status updates in real-time.
  rpc Heartbeat(stream HeartbeatRequest) returns (stream HeartbeatResponse);

  // ExecuteVMCommand sends VM lifecycle commands (create, start, stop, destroy)
  // to the node agent. This is a unary RPC as commands must complete
  // before returning a response.
  rpc ExecuteVMCommand(VMCommandRequest) returns (VMCommandResponse);

  // GetVMStatus retrieves the current state of a VM including resource usage,
  // running processes, and health information.
  rpc GetVMStatus(VMStatusRequest) returns (VMStatusResponse);

  // StreamVMMetrics opens a server-side streaming connection for real-time
  // VM metrics including CPU, memory, disk, and network statistics.
  rpc StreamVMMetrics(VMMetricsRequest) returns (stream VMMetricsResponse);

  // CreateSnapshot creates a point-in-time snapshot of a VM's disk state.
  // Can also be used to list, restore, or delete existing snapshots.
  rpc CreateSnapshot(SnapshotRequest) returns (SnapshotResponse);

  // ApplyNetworkConfig applies TC (traffic control) and iptables rules
  // to enforce bandwidth limits, firewall rules, and network isolation.
  rpc ApplyNetworkConfig(NetworkConfigRequest) returns (NetworkConfigResponse);

  // StartVNCProxy starts a noVNC proxy server for browser-based console access
  // to the VM. Returns connection details for the WebSocket VNC session.
  rpc StartVNCProxy(VNCProxyRequest) returns (VNCProxyResponse);

  // GetNodeInfo retrieves detailed system information about the node including
  // OS version, kernel version, CPU info, memory, disk, and libvirt version.
  rpc GetNodeInfo(GetNodeInfoRequest) returns (GetNodeInfoResponse);

  // ImportDisk imports a disk image from a source path to the VM's storage.
  // Used for VM migration from external sources.
  rpc ImportDisk(DiskImportRequest) returns (DiskImportResponse);

  // BackupDisk exports a VM's primary disk (compressed qcow2) and uploads it to
  // the node's configured object storage, returning the object key, size and
  // checksum. This is the real backup payload (not just metadata).
  rpc BackupDisk(BackupDiskRequest) returns (BackupDiskResponse);

  // RestoreDisk downloads a previously-backed-up qcow2 from object storage,
  // verifies its SHA256, and swaps it into the VM's primary disk. The VM MUST
  // be shut off; the agent rejects the call otherwise.
  rpc RestoreDisk(RestoreDiskRequest) returns (RestoreDiskResponse);

  // GetLiveMetrics retrieves real-time system metrics from the node including
  // CPU usage, memory usage, disk usage, network I/O, disk I/O, and load average.
  rpc GetLiveMetrics(GetLiveMetricsRequest) returns (GetLiveMetricsResponse);

  // ScanVMs scans the node for all VMs via libvirt and returns their info for import
  rpc ScanVMs(ScanVMsRequest) returns (ScanVMsResponse);

  // CreateStorageVolume provisions a real disk image (qcow2/raw) in a storage
  // pool directory on the node, returning its path and actual size.
  rpc CreateStorageVolume(CreateStorageVolumeRequest) returns (CreateStorageVolumeResponse);

  // DeleteStorageVolume removes a previously provisioned volume file from the node.
  rpc DeleteStorageVolume(DeleteStorageVolumeRequest) returns (DeleteStorageVolumeResponse);

  // MigrateVM live-migrates a domain from this (source) node to a destination
  // libvirt URI using peer-to-peer migration.
  rpc MigrateVM(MigrateVMRequest) returns (MigrateVMResponse);

  // SyncTemplate downloads/caches an OS template image on this node and returns
  // its local path, size and checksum (idempotent — reuses a cached copy).
  rpc SyncTemplate(SyncTemplateRequest) returns (SyncTemplateResponse);

  // AttachDisk provisions a new data volume and hot-plugs it into a VM as the
  // next free virtio target. DetachDisk removes it (and optionally deletes it).
  rpc AttachDisk(AttachDiskRequest) returns (AttachDiskResponse);
  rpc DetachDisk(DetachDiskRequest) returns (DetachDiskResponse);

  // DefineNetwork creates+starts an isolated/NAT libvirt network (a managed
  // bridge for private VPC segments). UndefineNetwork removes it.
  rpc DefineNetwork(DefineNetworkRequest) returns (DefineNetworkResponse);
  rpc UndefineNetwork(UndefineNetworkRequest) returns (UndefineNetworkResponse);

  // ProbeIPs ARP-probes a set of IPs on a bridge and returns those that answer
  // (i.e. are live on the wire). The panel uses this to detect IPs already used
  // by VMs it doesn't manage (e.g. pre-existing unmanaged guests), so it never
  // allocates a live customer IP and its IPAM view reflects reality.
  rpc ProbeIPs(ProbeIPsRequest) returns (ProbeIPsResponse);

  // ConfigureFloatingIP attaches or detaches a floating (elastic) IP on the
  // host: the address is bound to the uplink bridge and 1:1-NATed to the VM's
  // own address, so it can be moved between VMs on the node without any guest
  // cooperation. Idempotent — the panel re-applies attachments after a node
  // reboot, since iptables rules are runtime-only state.
  rpc ConfigureFloatingIP(FloatingIPRequest) returns (FloatingIPResponse);

  // ConfigureVPC creates or removes a tenant VPC on this node: a bridge for the
  // guests plus a router network namespace holding the VPC's gateway and NAT.
  //
  // The gateway deliberately lives in a namespace rather than on the host. The
  // host has a single routing table, so two tenants using the same subnet would
  // otherwise produce two competing routes and the kernel would deliver both
  // tenants' traffic to whichever bridge came first — a cross-tenant misdelivery,
  // not merely a clash. A namespace per VPC gives each its own routing table, so
  // overlapping tenant subnets are safe.
  rpc ConfigureVPC(VPCRequest) returns (VPCResponse);
}

// ============================================================================
// Node Registration
// ============================================================================

// RegisterNodeRequest is sent by the agent to register with the panel.
message RegisterNodeRequest {
  // hostname is the system's hostname
  string hostname = 1;

  // agent_version is the version of the agent software
  string agent_version = 2;

  // total_resources describes the total capacity of the node
  VMResources total_resources = 3;

  // capabilities lists features supported by this node (e.g., "kvm", "zfs", "snapshot")
  repeated string capabilities = 4;

  // labels are user-defined key-value pairs for node organization
  map<string, string> labels = 5;

  // public_ip is the node's public IP address
  string public_ip = 6;

  // region is the geographical region where the node is located
  string region = 7;
}

// RegisterNodeResponse is returned by the panel after successful registration.
message RegisterNodeResponse {
  // node_id is the unique identifier assigned to this node
  string node_id = 1;

  // auth_token is the bearer token for authenticating subsequent requests
  string auth_token = 2;

  // refresh_interval specifies how often the agent should send heartbeats
  google.protobuf.Duration refresh_interval = 3;

  // metrics_interval specifies how often to collect and report metrics
  google.protobuf.Duration metrics_interval = 4;
}

// ============================================================================
// Heartbeat
// ============================================================================

// HeartbeatRequest is sent by the agent to report its current status.
message HeartbeatRequest {
  // timestamp when this heartbeat was generated
  google.protobuf.Timestamp timestamp = 1;

  // node_id identifies the sending node
  string node_id = 2;

  // available_resources shows current available capacity
  VMResources available_resources = 3;

  // active_vms lists currently running VMs on this node
  repeated string active_vm_ids = 4;

  // system_load contains node-level system metrics
  SystemLoad system_load = 5;

  // vm_bandwidth_usage reports per-VM traffic counters
  repeated VMBandwidthReport vm_bandwidth_usage = 6;
}

// VMBandwidthReport contains cumulative traffic counters for a single VM.
// The agent reads these from /sys/class/net/<vnet>/statistics/.
message VMBandwidthReport {
  // vm_id is the VM identifier
  string vm_id = 1;

  // rx_bytes is the total bytes received since VM boot (cumulative counter)
  int64 rx_bytes = 2;

  // tx_bytes is the total bytes transmitted since VM boot (cumulative counter)
  int64 tx_bytes = 3;

  // interface_name is the vnet interface name (e.g., vnet0)
  string interface_name = 4;
}

// HeartbeatResponse is sent by the panel in response to heartbeats.
message HeartbeatResponse {
  // timestamp when this response was generated
  google.protobuf.Timestamp timestamp = 1;

  // commands_pending indicates if there are pending commands for this node
  bool commands_pending = 2;

  // config_update signals if the node should fetch new configuration
  bool config_update = 3;

  // acknowledged confirms the heartbeat was received
  bool acknowledged = 4;
}

// SystemLoad contains node-level system metrics.
message SystemLoad {
  // cpu_percent is the current CPU utilization (0-100)
  double cpu_percent = 1;

  // memory_used_bytes is the amount of memory in use
  int64 memory_used_bytes = 2;

  // memory_total_bytes is the total available memory
  int64 memory_total_bytes = 3;

  // disk_io_read_bytes_per_sec is disk read throughput
  int64 disk_io_read_bytes_per_sec = 4;

  // disk_io_write_bytes_per_sec is disk write throughput
  int64 disk_io_write_bytes_per_sec = 5;

  // network_rx_bytes_per_sec is network receive throughput
  int64 network_rx_bytes_per_sec = 6;

  // network_tx_bytes_per_sec is network transmit throughput
  int64 network_tx_bytes_per_sec = 7;
}

// ============================================================================
// VM Resources
// ============================================================================

// VMResources defines CPU, memory, and disk allocation for a VM.
message VMResources {
  // vcpus is the number of virtual CPUs
  int32 vcpus = 1;

  // memory_mb is the amount of RAM in megabytes
  int64 memory_mb = 2;

  // disk_gb is the disk size in gigabytes
  int64 disk_gb = 3;

  // swap_mb is the swap size in megabytes (optional)
  int64 swap_mb = 4;

  // network_bandwidth_mbps is the network bandwidth limit in Mbps
  int32 network_bandwidth_mbps = 5;

  // iops_limit is the disk IOPS limit (0 = unlimited)
  int32 iops_limit = 6;
}

// ============================================================================
// VM Commands
// ============================================================================

// VMCommandType enumerates the possible VM lifecycle operations.
enum VMCommandType {
  VM_COMMAND_TYPE_UNSPECIFIED = 0;
  VM_COMMAND_TYPE_CREATE = 1;    // Create a new VM
  VM_COMMAND_TYPE_START = 2;     // Start an existing VM
  VM_COMMAND_TYPE_STOP = 3;      // Graceful shutdown
  VM_COMMAND_TYPE_FORCE_STOP = 4;// Force power off
  VM_COMMAND_TYPE_RESTART = 5;   // Restart the VM
  VM_COMMAND_TYPE_DESTROY = 6;   // Delete the VM and its data
  VM_COMMAND_TYPE_PAUSE = 7;     // Pause execution
  VM_COMMAND_TYPE_RESUME = 8;    // Resume from pause
  VM_COMMAND_TYPE_REBUILD = 9;   // Reinstall OS (replace disk from template)
  VM_COMMAND_TYPE_RESIZE = 10;   // Change vCPU/memory allocation
  VM_COMMAND_TYPE_RESET_PASSWORD = 11; // Reset the guest root password
  VM_COMMAND_TYPE_ATTACH_ISO = 12; // Attach a bootable install/rescue ISO
  VM_COMMAND_TYPE_DETACH_ISO = 13; // Detach the install/rescue ISO
  VM_COMMAND_TYPE_REPAIR_CONSOLE = 14; // Inject a VNC <graphics> device into a domain that lacks one (restarts the VM)
}

// DiskStorageDisposition is the fail-closed, idempotent accountability verdict
// the agent returns for destructive disk/storage lifecycle operations. It lets
// the panel retain quota accounting when an operation cannot be proven safe.
//
// Backward-compatible addition: never renumber. New callers read these; older
// callers that omit operation_id get UNKNOWN/PRESENT on ambiguous states.
enum DiskStorageDisposition {
  // DISK_STORAGE_DISPOSITION_UNSPECIFIED is the zero value (no verdict emitted).
  DISK_STORAGE_DISPOSITION_UNSPECIFIED = 0;
  // DISK_STORAGE_DISPOSITION_UNKNOWN: the agent could NOT prove the disk/storage
  // is absent or present (timeout, transport loss, ambiguous recovery). The panel
  // MUST retain quota accounting — this is never a success.
  DISK_STORAGE_DISPOSITION_UNKNOWN = 1;
  // DISK_STORAGE_DISPOSITION_PRESENT: the backing volume and/or libvirt attachment
  // is still present. Must NOT be reported as a destructive/accounting-safe success.
  DISK_STORAGE_DISPOSITION_PRESENT = 2;
  // DISK_STORAGE_DISPOSITION_ATTACHED: the libvirt attachment is confirmed present
  // (used by successful attach, or to reject an unsafe detach that left it attached).
  DISK_STORAGE_DISPOSITION_ATTACHED = 3;
  // DISK_STORAGE_DISPOSITION_ABSENT: both libvirt attachment and backing storage
  // are confirmed gone. Safe to release quota accounting.
  DISK_STORAGE_DISPOSITION_ABSENT = 4;
}

// VMCommandRequest sends a lifecycle command to a VM.
message VMCommandRequest {
  // vm_id is the unique identifier for the VM
  string vm_id = 1;

  // command specifies the operation to perform
  VMCommandType command = 2;

  // config is required for CREATE commands
  VMConfig config = 3;

  // timeout_seconds specifies max time to wait for the command (0 = default)
  int32 timeout_seconds = 4;

  // async if true, returns immediately without waiting for completion
  bool async = 5;

  // operation_id is an idempotency key for destructive operations (DESTROY and
  // any future destructive command). Callers MUST supply a nonempty, bounded,
  // opaque operation ID so the agent can persist a durable manifest and return
  // the recorded result on retry after response loss. Omitting it makes the
  // agent fail closed (UNKNOWN/PRESENT) for destructive commands.
  string operation_id = 6;

  // delete_volumes requests that the VM's managed backing storage be destroyed
  // along with the domain. This is the explicit destructive-data-volume flag for
  // the DESTROY command. When false (or omitted), the agent must NOT claim an
  // accounting-safe destructive success; any residual storage yields
  // UNKNOWN/PRESENT. Behavior is wired in a later lane (C2); the field exists now
  // for backward-compatible rolling rollout.
  bool delete_volumes = 7;
}

// VMCommandResponse reports the result of a VM command.
message VMCommandResponse {
  // success indicates if the command completed successfully
  bool success = 1;

  // vm_id of the affected VM
  string vm_id = 2;

  // command that was executed
  VMCommandType command = 3;

  // error details if success is false
  ErrorResponse error = 4;

  // state is the new VM state after the command
  VMState state = 5;

  // message contains additional information about the result
  string message = 6;

  // operation_id echoes the idempotency key supplied in the request (if any).
  string operation_id = 7;

  // storage_disposition reports the fail-closed disk/storage verdict for
  // destructive commands (esp. DESTROY). UNSPECIFIED for non-disk commands.
  DiskStorageDisposition storage_disposition = 8;
}

// VMConfig defines the configuration for creating a new VM.
message VMConfig {
  // resources specifies CPU, memory, and disk allocation
  VMResources resources = 1;

  // image_id is the OS image to use (e.g., "ubuntu-22.04")
  string image_id = 2;

  // network_config defines network interfaces and settings
  VMNetworkConfig network_config = 3;

  // storage_config defines additional storage volumes
  StorageConfig storage_config = 4;

  // ssh_public_key for initial user access
  string ssh_public_key = 5;

  // user_data is cloud-init compatible configuration
  string user_data = 6;

  // metadata is key-value pairs for VM identification
  map<string, string> metadata = 7;

  // vnc_enabled enables VNC console access
  bool vnc_enabled = 8;

  // vnc_password sets a password for VNC access (optional)
  string vnc_password = 9;

  // root_password, when set (RESET_PASSWORD command), is the new guest root
  // password to apply via the guest agent.
  string root_password = 10;
}

// ============================================================================
// VM State
// ============================================================================

// VMState represents the current state of a virtual machine.
enum VMState {
  VM_STATE_UNSPECIFIED = 0;
  VM_STATE_PENDING = 1;      // VM is being created/configured
  VM_STATE_RUNNING = 2;      // VM is actively running
  VM_STATE_STOPPED = 3;      // VM is powered off
  VM_STATE_PAUSED = 4;       // VM execution is paused
  VM_STATE_ERROR = 5;        // VM is in an error state
  VM_STATE_MIGRATING = 6;    // VM is being migrated
  VM_STATE_SNAPSHOTTING = 7; // Snapshot operation in progress
  VM_STATE_DESTROYED = 8;    // VM has been destroyed
}

// VMStatusRequest queries the current state of a VM.
message VMStatusRequest {
  // vm_id is the VM to query
  string vm_id = 1;

  // include_metrics if true, includes current resource usage
  bool include_metrics = 2;
}

// VMStatusResponse contains the current VM status.
message VMStatusResponse {
  // vm_id of the queried VM
  string vm_id = 1;

  // current state of the VM
  VMState state = 2;

  // uptime_seconds since the VM was started
  int64 uptime_seconds = 3;

  // pid is the process ID of the VM on the host (if running)
  int32 pid = 4;

  // current_resources shows actual resource usage
  VMResourceUsage current_resources = 5;

  // ip_addresses assigned to the VM
  repeated string ip_addresses = 6;

  // vnc_port if VNC is enabled
  int32 vnc_port = 7;

  // last_state_change timestamp
  google.protobuf.Timestamp last_state_change = 8;

  // error_message if VM is in ERROR state
  string error_message = 9;
}

// VMResourceUsage contains actual resource consumption metrics.
message VMResourceUsage {
  // cpu_percent is current CPU utilization (0-100 per vCPU)
  double cpu_percent = 1;

  // memory_used_mb is current memory consumption
  int64 memory_used_mb = 2;

  // memory_total_mb is allocated memory
  int64 memory_total_mb = 3;

  // disk_read_bytes is total bytes read from disk
  int64 disk_read_bytes = 4;

  // disk_write_bytes is total bytes written to disk
  int64 disk_write_bytes = 5;

  // disk_read_iops is current read IOPS
  int32 disk_read_iops = 6;

  // disk_write_iops is current write IOPS
  int32 disk_write_iops = 7;

  // network_rx_bytes is total bytes received
  int64 network_rx_bytes = 8;

  // network_tx_bytes is total bytes transmitted
  int64 network_tx_bytes = 9;
}

// ============================================================================
// VM Metrics Streaming
// ============================================================================

// VMMetricsRequest initiates a metrics stream for one or more VMs.
message VMMetricsRequest {
  // vm_ids to monitor (empty = all VMs on node)
  repeated string vm_ids = 1;

  // interval_ms between metric samples
  int32 interval_ms = 2;

  // metric_types to include (empty = all)
  repeated MetricType metric_types = 3;
}

// VMMetricsResponse contains a single metrics sample.
message VMMetricsResponse {
  // timestamp when metrics were collected
  google.protobuf.Timestamp timestamp = 1;

  // vm_id these metrics belong to
  string vm_id = 2;

  // cpu metrics
  CPUMetrics cpu = 3;

  // memory metrics
  MemoryMetrics memory = 4;

  // disk metrics
  DiskMetrics disk = 5;

  // network metrics
  NetworkMetrics network = 6;

  // process metrics
  ProcessMetrics process = 7;
}

// MetricType enumerates available metric categories.
enum MetricType {
  METRIC_TYPE_UNSPECIFIED = 0;
  METRIC_TYPE_CPU = 1;
  METRIC_TYPE_MEMORY = 2;
  METRIC_TYPE_DISK = 3;
  METRIC_TYPE_NETWORK = 4;
  METRIC_TYPE_PROCESS = 5;
}

// CPUMetrics contains CPU utilization data.
message CPUMetrics {
  // usage_percent is aggregate CPU utilization (0-100 * vcpus)
  double usage_percent = 1;

  // per_vcpu_percent breaks down usage by virtual CPU
  repeated double per_vcpu_percent = 2;

  // steal_time_percent is time spent waiting for hypervisor
  double steal_time_percent = 3;

  // iowait_percent is time spent waiting for IO
  double iowait_percent = 4;
}

// MemoryMetrics contains memory utilization data.
message MemoryMetrics {
  // used_bytes is currently used memory
  int64 used_bytes = 1;

  // available_bytes is memory available for use
  int64 available_bytes = 2;

  // total_bytes is total allocated memory
  int64 total_bytes = 3;

  // swap_used_bytes is swap space in use
  int64 swap_used_bytes = 4;

  // swap_total_bytes is total swap allocated
  int64 swap_total_bytes = 5;

  // cache_bytes is filesystem cache
  int64 cache_bytes = 6;
}

// DiskMetrics contains disk IO statistics.
message DiskMetrics {
  // read_bytes_per_sec is current read throughput
  int64 read_bytes_per_sec = 1;

  // write_bytes_per_sec is current write throughput
  int64 write_bytes_per_sec = 2;

  // read_iops is current read operations per second
  int32 read_iops = 3;

  // write_iops is current write operations per second
  int32 write_iops = 4;

  // read_latency_ms is average read latency
  double read_latency_ms = 5;

  // write_latency_ms is average write latency
  double write_latency_ms = 6;

  // disk_usage_percent is disk space utilization (0-100)
  double disk_usage_percent = 7;
}

// NetworkMetrics contains network IO statistics.
message NetworkMetrics {
  // rx_bytes_per_sec is receive throughput
  int64 rx_bytes_per_sec = 1;

  // tx_bytes_per_sec is transmit throughput
  int64 tx_bytes_per_sec = 2;

  // rx_packets_per_sec is receive packet rate
  int64 rx_packets_per_sec = 3;

  // tx_packets_per_sec is transmit packet rate
  int64 tx_packets_per_sec = 4;

  // rx_errors_per_sec is receive error rate
  int64 rx_errors_per_sec = 5;

  // tx_errors_per_sec is transmit error rate
  int64 tx_errors_per_sec = 6;

  // rx_dropped_per_sec is dropped receive packets
  int64 rx_dropped_per_sec = 7;

  // tx_dropped_per_sec is dropped transmit packets
  int64 tx_dropped_per_sec = 8;
}

// ProcessMetrics contains process-level information.
message ProcessMetrics {
  // process_count is number of processes in the VM
  int32 process_count = 1;

  // thread_count is number of threads
  int32 thread_count = 2;

  // load_average_1m is 1-minute load average
  double load_average_1m = 3;

  // load_average_5m is 5-minute load average
  double load_average_5m = 4;

  // load_average_15m is 15-minute load average
  double load_average_15m = 5;
}

// ============================================================================
// Snapshots
// ============================================================================

// SnapshotOperationType enumerates snapshot operations.
enum SnapshotOperationType {
  SNAPSHOT_OPERATION_TYPE_UNSPECIFIED = 0;
  SNAPSHOT_OPERATION_TYPE_CREATE = 1;   // Create new snapshot
  SNAPSHOT_OPERATION_TYPE_LIST = 2;     // List existing snapshots
  SNAPSHOT_OPERATION_TYPE_RESTORE = 3;  // Restore from snapshot
  SNAPSHOT_OPERATION_TYPE_DELETE = 4;   // Delete a snapshot
  SNAPSHOT_OPERATION_TYPE_INFO = 5;     // Get snapshot details
}

// SnapshotRequest initiates a snapshot operation.
message SnapshotRequest {
  // vm_id is the target VM
  string vm_id = 1;

  // operation specifies what to do
  SnapshotOperationType operation = 2;

  // snapshot_id is required for RESTORE, DELETE, and INFO operations
  string snapshot_id = 3;

  // name is the desired name for CREATE operations
  string name = 4;

  // description provides additional context
  string description = 5;

  // quiesce if true, attempts to quiesce filesystem before snapshot
  bool quiesce = 6;
}

// SnapshotResponse reports the result of a snapshot operation.
message SnapshotResponse {
  // success indicates if the operation succeeded
  bool success = 1;

  // operation that was performed
  SnapshotOperationType operation = 2;

  // snapshot contains details for CREATE, LIST, INFO operations
  SnapshotInfo snapshot = 3;

  // snapshots list for LIST operations
  repeated SnapshotInfo snapshots = 4;

  // error details if failed
  ErrorResponse error = 5;
}

// SnapshotInfo describes a single snapshot.
message SnapshotInfo {
  // snapshot_id is the unique identifier
  string snapshot_id = 1;

  // name of the snapshot
  string name = 2;

  // description of the snapshot
  string description = 3;

  // created_at timestamp
  google.protobuf.Timestamp created_at = 4;

  // size_bytes is the snapshot size
  int64 size_bytes = 5;

  // vm_state was the VM state when snapshot was taken
  VMState vm_state = 6;

  // parent_id is the parent snapshot (for chains)
  string parent_id = 7;
}

// ============================================================================
// Network Configuration
// ============================================================================

// VMNetworkConfig defines network settings for a VM.
message VMNetworkConfig {
  // interfaces list of network interfaces
  repeated NetworkInterface interfaces = 1;

  // firewall_rules to apply
  repeated FirewallRule firewall_rules = 2;

  // bandwidth_limits for traffic shaping
  BandwidthLimit bandwidth_limits = 3;

  // port_forwards (DNAT) to apply
  repeated PortForward port_forwards = 4;
}

// PortForward defines a DNAT port-forwarding rule.
message PortForward {
  // external_port on the host
  int32 external_port = 1;

  // internal_port on the VM
  int32 internal_port = 2;

  // protocol (tcp or udp); empty = tcp
  string protocol = 3;

  // source_cidr restricts the source; empty/"0.0.0.0/0" = any
  string source_cidr = 4;
}

// NetworkInterface defines a single network interface.
message NetworkInterface {
  // name is the interface identifier (e.g., "eth0")
  string name = 1;

  // type of interface (bridge, macvtap, etc.)
  NetworkInterfaceType type = 2;

  // bridge_name is the host bridge for bridge type
  string bridge_name = 3;

  // mac_address is the interface MAC (empty = auto-generate)
  string mac_address = 4;

  // ip_address assigned to this interface
  string ip_address = 5;

  // netmask CIDR prefix length (e.g. 24)
  int32 netmask = 6;

  // gateway for the assigned IP
  string gateway = 7;

  // use_dhcp if true, configure via DHCP instead of static
  bool use_dhcp = 8;

  // anti_spoofing enables anti-IP hijacking protection (iptables + ebtables + nwfilter)
  bool anti_spoofing = 9;

  // vlan_id is the 802.1Q VLAN tag for this interface (0 = untagged)
  int32 vlan_id = 10;
}

// NetworkInterfaceType enumerates network interface types.
enum NetworkInterfaceType {
  NETWORK_INTERFACE_TYPE_UNSPECIFIED = 0;
  NETWORK_INTERFACE_TYPE_BRIDGE = 1;
  NETWORK_INTERFACE_TYPE_MACVTAP = 2;
  NETWORK_INTERFACE_TYPE_USER = 3;
  NETWORK_INTERFACE_TYPE_PASSTHROUGH = 4;
}

// FirewallRule defines a single firewall rule.
message FirewallRule {
  // direction of traffic
  FirewallDirection direction = 1;

  // action to take
  FirewallAction action = 2;

  // protocol (tcp, udp, icmp, or all)
  string protocol = 3;

  // source_cidr is the source IP range
  string source_cidr = 4;

  // dest_port is the destination port or range (e.g., "80", "1000-2000")
  string dest_port = 5;

  // priority of the rule (lower = higher priority)
  int32 priority = 6;

  // description of the rule
  string description = 7;
}

// FirewallDirection enumerates traffic directions.
enum FirewallDirection {
  FIREWALL_DIRECTION_UNSPECIFIED = 0;
  FIREWALL_DIRECTION_INBOUND = 1;
  FIREWALL_DIRECTION_OUTBOUND = 2;
}

// FirewallAction enumerates firewall actions.
enum FirewallAction {
  FIREWALL_ACTION_UNSPECIFIED = 0;
  FIREWALL_ACTION_ALLOW = 1;
  FIREWALL_ACTION_DENY = 2;
  FIREWALL_ACTION_REJECT = 3;
}

// BandwidthLimit defines traffic shaping parameters.
message BandwidthLimit {
  // ingress_rate_mbps is incoming bandwidth limit
  int32 ingress_rate_mbps = 1;

  // egress_rate_mbps is outgoing bandwidth limit
  int32 egress_rate_mbps = 2;

  // burst_size_mb allows temporary bursts
  int32 burst_size_mb = 3;
}

// NetworkConfigRequest applies network configuration to a VM.
message NetworkConfigRequest {
  // vm_id is the target VM
  string vm_id = 1;

  // config to apply
  VMNetworkConfig config = 2;

  // replace_all if true, replaces entire config; if false, merges
  bool replace_all = 3;
}

// NetworkConfigResponse reports the result of network configuration.
message NetworkConfigResponse {
  // success indicates if configuration was applied
  bool success = 1;

  // applied_interfaces shows what was configured
  repeated NetworkInterface applied_interfaces = 2;

  // error details if failed
  ErrorResponse error = 3;
}

// ============================================================================
// Storage Configuration
// ============================================================================

// StorageConfig defines additional storage for a VM.
message StorageConfig {
  // primary_disk configuration
  DiskConfig primary_disk = 1;

  // additional_volumes to attach
  repeated DiskConfig additional_volumes = 2;
}

// DiskConfig defines a single disk or volume.
message DiskConfig {
  // id is the unique identifier for this disk
  string id = 1;

  // size_gb is the disk size
  int64 size_gb = 2;

  // format is the disk image format (qcow2, raw, etc.)
  DiskFormat format = 3;

  // backend is the storage backend type
  StorageBackend backend = 4;

  // backing_image is a base image for copy-on-write (optional)
  string backing_image = 5;

  // mount_point in the guest (for additional volumes)
  string mount_point = 6;
}

// DiskFormat enumerates supported disk formats.
enum DiskFormat {
  DISK_FORMAT_UNSPECIFIED = 0;
  DISK_FORMAT_QCOW2 = 1;
  DISK_FORMAT_RAW = 2;
  DISK_FORMAT_VMDK = 3;
  DISK_FORMAT_VDI = 4;
}

// StorageBackend enumerates storage backends.
enum StorageBackend {
  STORAGE_BACKEND_UNSPECIFIED = 0;
  STORAGE_BACKEND_LOCAL = 1;
  STORAGE_BACKEND_ZFS = 2;
  STORAGE_BACKEND_LVM = 3;
  STORAGE_BACKEND_CEPH = 4;
  STORAGE_BACKEND_NFS = 5;
}

// ============================================================================
// VNC Proxy
// ============================================================================

// VNCProxyRequest initiates a VNC proxy for console access.
message VNCProxyRequest {
  // vm_id is the target VM
  string vm_id = 1;

  // websocket_port to bind (0 = auto-assign)
  int32 websocket_port = 2;

  // expiry_seconds for the proxy session (0 = no expiry)
  int32 expiry_seconds = 3;

  // one_time if true, proxy stops after first connection
  bool one_time = 4;
}

// VNCProxyResponse provides VNC connection details.
message VNCProxyResponse {
  // success indicates if proxy was started
  bool success = 1;

  // websocket_url is the WebSocket endpoint for noVNC
  string websocket_url = 2;

  // websocket_port the proxy is listening on
  int32 websocket_port = 3;

  // token for authentication
  string token = 4;

  // expires_at when the session expires
  google.protobuf.Timestamp expires_at = 5;

  // error details if failed
  ErrorResponse error = 6;
}

// ============================================================================
// Common Messages
// ============================================================================

// ErrorResponse provides detailed error information.
message ErrorResponse {
  // code is a machine-readable error code
  ErrorCode code = 1;

  // message is a human-readable description
  string message = 2;

  // details contains additional error context
  map<string, string> details = 3;

  // retryable indicates if the operation can be retried
  bool retryable = 4;
}

// ErrorCode enumerates possible error conditions.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INTERNAL = 1;           // Internal server error
  ERROR_CODE_INVALID_ARGUMENT = 2;   // Invalid request parameter
  ERROR_CODE_NOT_FOUND = 3;          // Resource not found
  ERROR_CODE_ALREADY_EXISTS = 4;     // Resource already exists
  ERROR_CODE_PERMISSION_DENIED = 5;  // Insufficient permissions
  ERROR_CODE_RESOURCE_EXHAUSTED = 6; // Resource limits reached
  ERROR_CODE_UNAVAILABLE = 7;        // Service temporarily unavailable
  ERROR_CODE_TIMEOUT = 8;            // Operation timed out
  ERROR_CODE_CONFLICT = 9;           // State conflict
  ERROR_CODE_UNAUTHENTICATED = 10;   // Authentication required
}

// ============================================================================
// Node Information
// ============================================================================

// GetNodeInfoRequest requests detailed system information about a node.
message GetNodeInfoRequest {
  // Empty request - node is identified by connection context
}

// GetNodeInfoResponse contains detailed system information about a node.
message GetNodeInfoResponse {
  // success indicates if the operation succeeded
  bool success = 1;

  // os_info contains operating system information
  OSInfo os_info = 2;

  // cpu_info contains CPU information
  CPUInfo cpu_info = 3;

  // memory_total_bytes is the total system memory
  int64 memory_total_bytes = 4;

  // disk_total_bytes is the total disk space
  int64 disk_total_bytes = 5;

  // libvirt_version is the installed libvirt version
  string libvirt_version = 6;

  // error details if failed
  ErrorResponse error = 7;

  // === Live metrics fields (added for real-time monitoring) ===

  // cpu_percent is the current CPU usage percentage (0-100)
  double cpu_percent = 8;

  // memory_used_bytes is the current memory usage in bytes
  int64 memory_used_bytes = 9;

  // memory_used_percent is the memory usage percentage (0-100)
  double memory_used_percent = 10;

  // disk_used_bytes is the current disk usage in bytes
  int64 disk_used_bytes = 11;

  // disk_used_percent is the disk usage percentage (0-100)
  double disk_used_percent = 12;

  // network_rx_bytes_per_sec is the network receive rate
  int64 network_rx_bytes_per_sec = 13;

  // network_tx_bytes_per_sec is the network transmit rate
  int64 network_tx_bytes_per_sec = 14;

  // disk_read_bytes_per_sec is the disk read rate
  int64 disk_read_bytes_per_sec = 15;

  // disk_write_bytes_per_sec is the disk write rate
  int64 disk_write_bytes_per_sec = 16;

  // load_avg_1 is the 1-minute load average
  double load_avg_1 = 17;

  // load_avg_5 is the 5-minute load average
  double load_avg_5 = 18;

  // load_avg_15 is the 15-minute load average
  double load_avg_15 = 19;

  // running_vm_count is the number of running VMs
  int32 running_vm_count = 20;

  // available_cpus is the number of available CPU cores
  int32 available_cpus = 21;

  // available_memory_mb is the available memory in MB
  int64 available_memory_mb = 22;

  // available_disk_gb is the available disk space in GB
  int64 available_disk_gb = 23;
}

// OSInfo contains operating system information.
message OSInfo {
  // os_name is the operating system name (e.g., "Ubuntu", "CentOS")
  string os_name = 1;

  // os_version is the OS version (e.g., "22.04", "8")
  string os_version = 2;

  // kernel_version is the kernel version string
  string kernel_version = 3;

  // architecture is the system architecture (e.g., "x86_64", "aarch64")
  string architecture = 4;
}

// CPUInfo contains CPU information.
message CPUInfo {
  // model is the CPU model name
  string model = 1;

  // cores is the number of CPU cores
  int32 cores = 2;

  // threads is the number of CPU threads
  int32 threads = 3;

  // architecture is the CPU architecture
  string architecture = 4;

  // flags are the CPU feature flags
  repeated string flags = 5;
}

// ============================================================================
// Disk Import
// ============================================================================

// DiskImportRequest requests importing a disk image for a VM.
message DiskImportRequest {
  // vm_id is the target VM
  string vm_id = 1;

  // source_path is the path to the source disk image
  string source_path = 2;

  // target_path is the destination path for the disk image
  string target_path = 3;

  // format is the disk image format (qcow2, raw, vmdk, etc.)
  string format = 4;

  // action specifies how to handle the disk (copy, move, symlink)
  string action = 5;
}

// DiskImportResponse reports the result of a disk import operation.
message DiskImportResponse {
  // success indicates if the import succeeded
  bool success = 1;

  // vm_id of the affected VM
  string vm_id = 2;

  // imported_path is the final path where the disk was imported
  string imported_path = 3;

  // size_bytes is the size of the imported disk
  int64 size_bytes = 4;

  // error details if failed
  ErrorResponse error = 5;
}

// BackupDiskRequest requests a compressed disk backup of a VM to object storage.
message BackupDiskRequest {
  // vm_id is the VM whose primary disk should be backed up
  string vm_id = 1;

  // destination_key is the object storage key to upload the backup to
  string destination_key = 2;

  // compress enables qcow2 compression of the exported image
  bool compress = 3;
}

// BackupDiskResponse reports the result of a disk backup.
message BackupDiskResponse {
  // success indicates if the backup+upload succeeded
  bool success = 1;

  // object_key is the storage key the disk was uploaded to
  string object_key = 2;

  // size_bytes is the size of the uploaded backup image
  int64 size_bytes = 3;

  // checksum is the SHA256 (hex) of the uploaded image
  string checksum = 4;

  // error details if failed
  ErrorResponse error = 5;
}

// RestoreDiskRequest requests restoring a VM's primary disk from a backup object.
message RestoreDiskRequest {
  // vm_id is the VM whose primary disk should be overwritten
  string vm_id = 1;

  // source_key is the object storage key of the backup qcow2 to restore
  string source_key = 2;

  // expected_checksum is the SHA256 (hex) recorded when the backup was taken;
  // the agent aborts if the downloaded object does not match
  string expected_checksum = 3;
}

// RestoreDiskResponse reports the result of a disk restore.
message RestoreDiskResponse {
  bool success = 1;
  // bytes_restored is the size of the restored image written to the disk
  int64 bytes_restored = 2;
  ErrorResponse error = 3;
}

// ============================================================================
// Storage Volume Provisioning
// ============================================================================

// CreateStorageVolumeRequest provisions a new volume in a storage pool.
message CreateStorageVolumeRequest {
  // pool_path is the pool's backing identifier: a directory for dir/file pools,
  // an LVM volume group for lvm pools, or a ZFS dataset for zfs pools.
  string pool_path = 1;

  // name is the volume name (a file extension is added for dir/file pools)
  string name = 2;

  // format is "qcow2" or "raw" (used by dir/file pools only)
  string format = 3;

  // size_gb is the size of the volume in GB
  int64 size_gb = 4;

  // pool_type selects the provisioning backend: "dir"/"file" (qemu-img),
  // "lvm" (lvcreate), or "zfs" (zfs create -V). Empty defaults to dir.
  string pool_type = 5;
}

// CreateStorageVolumeResponse reports the provisioned volume.
message CreateStorageVolumeResponse {
  bool success = 1;
  // path is the absolute path of the created volume on the node
  string path = 2;
  // actual_size_bytes is the on-disk size after creation
  int64 actual_size_bytes = 3;
  ErrorResponse error = 4;
}

// DeleteStorageVolumeRequest removes a provisioned volume.
message DeleteStorageVolumeRequest {
  // path is the absolute path/device of the volume to delete
  string path = 1;

  // pool_type selects the removal backend (dir/file=rm, lvm=lvremove, zfs=destroy)
  string pool_type = 2;
}

// DeleteStorageVolumeResponse reports the result of a volume deletion.
message DeleteStorageVolumeResponse {
  bool success = 1;
  ErrorResponse error = 2;
}

// AttachDiskRequest provisions a data disk and attaches it to a VM.
message AttachDiskRequest {
  string vm_id = 1;
  int64 size_gb = 2;
  // pool_type selects the volume backend (dir/lvm/zfs); empty = dir.
  string pool_type = 3;
  // pool_path is the backing dir / VG / dataset; empty = node default image dir.
  string pool_path = 4;
  // operation_id is a required, bounded, opaque idempotency key for attach. The
  // agent persists a durable manifest keyed by this ID and returns the recorded
  // result on retry; a retry after response loss must NEVER create a second
  // volume for the same operation. Empty operation_id is rejected fail-closed.
  string operation_id = 5;
}

// AttachDiskResponse reports the attached device and its backing path.
message AttachDiskResponse {
  bool success = 1;
  string device = 2; // e.g. "vdb"
  string path = 3;   // backing volume path
  ErrorResponse error = 4;
  // operation_id echoes the idempotency key supplied in the request (if any).
  string operation_id = 5;
  // storage_disposition reports the attach verdict (ATTACHED on success;
  // PRESENT/UNKNOWN when a partial/recovered state cannot be proven attached).
  DiskStorageDisposition storage_disposition = 6;
}

// DetachDiskRequest removes a data disk from a VM.
message DetachDiskRequest {
  string vm_id = 1;
  string device = 2; // e.g. "vdb"
  string path = 3;   // backing volume path
  bool delete_volume = 4;
  string pool_type = 5; // for deletion backend; empty = dir
  // operation_id is a required, bounded, opaque idempotency key for detach. The
  // agent persists a durable manifest before any destructive action and returns
  // the recorded result on retry. Empty operation_id is rejected fail-closed.
  string operation_id = 6;
}

// DetachDiskResponse reports the result of a disk detach.
message DetachDiskResponse {
  bool success = 1;
  ErrorResponse error = 2;
  // operation_id echoes the idempotency key supplied in the request (if any).
  string operation_id = 3;
  // storage_disposition reports the detach verdict (ABSENT on full cleanup;
  // ATTACHED/PRESENT/UNKNOWN when the agent cannot prove absence). delete_volume
  // must be honored: an unsafe detach yields PRESENT, never accounting-safe success.
  DiskStorageDisposition storage_disposition = 4;
}

// DefineNetworkRequest creates a managed libvirt network for a private segment.
message DefineNetworkRequest {
  string name = 1;   // unique libvirt network name
  string mode = 2;   // "isolated" (no uplink) or "nat"
  string bridge = 3; // desired bridge name; empty = agent generates one
  string cidr = 4;   // e.g. 10.20.0.0/24 — host takes the first usable address
  bool dhcp = 5;     // hand out DHCP leases on this network
}

// DefineNetworkResponse reports the created bridge.
message DefineNetworkResponse {
  bool success = 1;
  string bridge = 2; // bridge libvirt created/used
  ErrorResponse error = 3;
}

// UndefineNetworkRequest removes a managed libvirt network.
message UndefineNetworkRequest {
  string name = 1;
}

// UndefineNetworkResponse reports the result of a network removal.
message UndefineNetworkResponse {
  bool success = 1;
  ErrorResponse error = 2;
}

// MigrateVMRequest live-migrates a domain to a destination node.
message MigrateVMRequest {
  // vm_id is the domain UUID to migrate (must exist on this source node)
  string vm_id = 1;

  // dest_uri is the destination libvirt connection URI, e.g.
  // "qemu+ssh://root@203.0.113.131/system"
  string dest_uri = 2;

  // live performs a live migration (no downtime) when true
  bool live = 3;

  // copy_storage enables full block migration (disks copied; no shared storage)
  bool copy_storage = 4;
}

// MigrateVMResponse reports the result of a migration.
message MigrateVMResponse {
  bool success = 1;
  string message = 2;
  ErrorResponse error = 3;
}

// SyncTemplateRequest asks the node to cache an OS template image locally.
message SyncTemplateRequest {
  // image_url is the template source (http(s) URL or an absolute path on the node)
  string image_url = 1;

  // expected_checksum, when set, is verified (sha256 hex) after download
  string expected_checksum = 2;
}

// SyncTemplateResponse reports the cached template on the node.
message SyncTemplateResponse {
  bool success = 1;
  // local_path is where the image is cached on the node
  string local_path = 2;
  // size_bytes is the cached image size
  int64 size_bytes = 3;
  // checksum is the sha256 (hex) of the cached image
  string checksum = 4;
  ErrorResponse error = 5;
}

// ============================================================================
// Live Metrics
// ============================================================================

// GetLiveMetricsRequest requests real-time system metrics from the node.
message GetLiveMetricsRequest {
  // Empty request - node is identified by connection context
}

// GetLiveMetricsResponse contains real-time system metrics.
message GetLiveMetricsResponse {
  // success indicates if the operation succeeded
  bool success = 1;

  // cpu_percent is the current CPU usage percentage (0-100)
  double cpu_percent = 2;

  // memory_used_bytes is the current memory usage in bytes
  int64 memory_used_bytes = 3;

  // memory_total_bytes is the total system memory in bytes
  int64 memory_total_bytes = 4;

  // memory_used_percent is the memory usage percentage (0-100)
  double memory_used_percent = 5;

  // disk_used_bytes is the current disk usage in bytes
  int64 disk_used_bytes = 6;

  // disk_total_bytes is the total disk space in bytes
  int64 disk_total_bytes = 7;

  // disk_used_percent is the disk usage percentage (0-100)
  double disk_used_percent = 8;

  // network_rx_bytes_per_sec is the network receive rate in bytes/sec
  int64 network_rx_bytes_per_sec = 9;

  // network_tx_bytes_per_sec is the network transmit rate in bytes/sec
  int64 network_tx_bytes_per_sec = 10;

  // disk_read_bytes_per_sec is the disk read rate in bytes/sec
  int64 disk_read_bytes_per_sec = 11;

  // disk_write_bytes_per_sec is the disk write rate in bytes/sec
  int64 disk_write_bytes_per_sec = 12;

  // load_avg_1 is the 1-minute load average
  double load_avg_1 = 13;

  // load_avg_5 is the 5-minute load average
  double load_avg_5 = 14;

  // load_avg_15 is the 15-minute load average
  double load_avg_15 = 15;

  // running_vm_count is the number of running VMs
  int32 running_vm_count = 16;

  // available_cpus is the number of available CPU cores
  int32 available_cpus = 17;

  // available_memory_mb is the available memory in MB
  int64 available_memory_mb = 18;

  // available_disk_gb is the available disk space in GB
  int64 available_disk_gb = 19;

  // error details if failed
  ErrorResponse error = 20;
}

// ============================================================================
// VM Scanning for Import
// ============================================================================

// ScanVMsRequest requests a scan of all VMs on the node
message ScanVMsRequest {
  // scan_path is an optional custom path to scan for XML files
  string scan_path = 1;
}

// ScanVMsResponse contains the list of discovered VMs
message ScanVMsResponse {
  bool success = 1;
  repeated ScannedVM vms = 2;
  int32 total_found = 3;
  ErrorResponse error = 4;
}

// ScannedVM represents a VM discovered on the node
message ScannedVM {
  string uuid = 1;
  string name = 2;
  string hostname = 3;
  int32 cpu = 4;
  int64 memory_mb = 5;
  int32 vnc_port = 6;
  string vnc_password = 7;
  string status = 8;
  repeated ScannedDisk disks = 9;
  repeated ScannedNetwork networks = 10;
  string xml_path = 11;
}

// ScannedDisk represents a disk found on a scanned VM
message ScannedDisk {
  string source_file = 1;
  string format = 2;
  string device = 3;
  string bus = 4;
  string target_dev = 5;
  int64 size_bytes = 6;
}

// ScannedNetwork represents a network interface found on a scanned VM
message ScannedNetwork {
  string mac_address = 1;
  string bridge = 2;
  string model = 3;
  string ip_address = 4;
}

// ============================================================================
// IP probing (ARP)
// ============================================================================

// ProbeIPsRequest asks the agent to ARP-probe ip_addresses on the given bridge.
message ProbeIPsRequest {
  string bridge = 1;                 // host bridge to probe on (e.g. viifbr0)
  repeated string ip_addresses = 2;  // IPv4 addresses to probe
  int32 timeout_ms = 3;              // per-probe wait; 0 → agent default (1000ms)
}

// ProbeIPsResponse reports which probed IPs are live on the wire.
message ProbeIPsResponse {
  repeated string in_use = 1;   // IPs that answered ARP (in use by some host)
  repeated string checked = 2;  // IPs actually probed (probe attempted)
}

// ============================================================================
// Floating IPs
// ============================================================================

// FloatingIPRequest attaches or detaches a floating IP on the node. internal_ip
// and nat_mode are required for detach as well as attach, so the agent can
// reconstruct and delete the exact rules it added without keeping state.
message FloatingIPRequest {
  string floating_ip = 1;  // the public /32 that moves between VMs
  string vm_id = 2;        // VM the address is (or was) attached to
  string internal_ip = 3;  // the VM's own address, i.e. the NAT destination
  string bridge = 4;       // uplink bridge to bind the address to and GARP on
  bool attach = 5;         // true = attach, false = detach
  string nat_mode = 6;     // "inbound" (DNAT only) or "full" (DNAT + SNAT)
}

// FloatingIPResponse reports the result of a floating IP attach/detach.
message FloatingIPResponse {
  bool success = 1;
  ErrorResponse error = 2;
}

// ============================================================================
// Tenant VPCs (router namespace per VPC)
// ============================================================================

// VPCRequest creates or removes a VPC on the node. Create is idempotent, so the
// panel can re-apply it to restore VPCs after a node reboot.
message VPCRequest {
  string vpc_id = 1;   // tenant VPC id; derives the namespace/bridge names
  string subnet = 2;   // customer-chosen CIDR, e.g. "10.0.0.0/24" (may overlap another tenant's)
  string gateway = 3;  // gateway address inside subnet, held by the router namespace
  bool create = 4;     // true = create/repair, false = remove
}

// VPCResponse reports the result and the bridge guests must attach to.
message VPCResponse {
  bool success = 1;
  string bridge = 2;        // host bridge for guest NICs (carries NO IP)
  string router_netns = 3;  // namespace holding the gateway, for diagnostics
  ErrorResponse error = 4;
}
