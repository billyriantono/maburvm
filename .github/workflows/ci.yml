name: CI

on:
  push:
  pull_request:
  schedule:
    # New advisories appear without a push: rescan every Monday.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Go line the production images build with (Dockerfile.panel). Move both together.
  GO_VERSION: "1.25.x"

jobs:
  go:
    name: Go build, vet and tests (panel, shared, agent)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # Same release as the production stack. Trust auth: a throwaway CI database, no password to keep.
        image: postgres:16.14
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: maburvm_enroll_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install libvirt headers and qemu-img
        # The agent links libvirt through cgo; qemu-img lets the volume round-trip test run instead of skipping.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvirt-dev pkg-config qemu-utils
      - name: Build everything
        run: go build ./...
      - name: Build the panel the way the image does (no cgo)
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/panel
      - name: Vet
        run: go vet ./...
      - name: Test
        # The pg tag adds the tests that run the whole migration chain on a real PostgreSQL.
        env:
          MABURVM_TEST_PG_DSN: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGDATABASE: maburvm_enroll_test
        run: go test -tags pg ./...

  vulnerabilities:
    name: Known vulnerabilities (govulncheck, npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install libvirt headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvirt-dev pkg-config
      - name: Install govulncheck
        # govulncheck needs a newer Go to build than the one the project builds with.
        env:
          GOTOOLCHAIN: auto
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - name: Scan Go code
        # Fails only for vulnerable code this project actually calls.
        run: govulncheck ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: always()
        with:
          node-version: "22"
      - name: Scan the web app's shipped dependencies
        if: always()
        working-directory: web
        run: npm audit --package-lock-only --omit=dev --audit-level=high

  web:
    name: Web type-check, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The Node line Dockerfile.web builds with.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: Browser tests (panel, web, fake node agent)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # e2e/stack.sh makes its own throwaway database on this server.
      PGHOST: 127.0.0.1
      PGUSER: postgres
      E2E_WEB_MODE: start
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Build the panel and the fake agent
        # Warms the build cache, so stack.sh builds within the web server's start-up time.
        run: go build ./cmd/panel ./cmd/fake-agent
      - run: npm ci
        working-directory: web
      - name: Install the browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Build the web app against the test panel
        working-directory: web
        env:
          API_BASE_URL: http://127.0.0.1:18480
        run: npm run build
      - name: Run the browser tests
        working-directory: web
        run: npx playwright test

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit: a secret removed in a later commit is still published.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the whole history
        # Findings are redacted in the log. Allowed test fixtures are listed in .gitleaks.toml.
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --verbose --no-banner'

  panel-backup:
    name: Panel backup image, restore round trip, compose files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint the scripts
        run: |
          shellcheck docker/panel-backup/panel-backup.sh scripts/panel-restore.sh scripts/test-panel-backup.sh internal/panel/handler/install_agent.sh \
            scripts/install-panel.sh scripts/upgrade-panel.sh scripts/test-upgrade-panel.sh scripts/release-notes.sh
      - name: Upgrade script decisions (against a stand-in docker)
        run: bash scripts/test-upgrade-panel.sh
      - name: Build the backup image
        run: docker build -t maburvm-panel-backup:ci docker/panel-backup
      - name: Back up and restore inside the image
        run: |
          docker run --rm --network host -e PGHOST=127.0.0.1 -e PGUSER=postgres \
            -v "$PWD:/src:ro" --entrypoint bash maburvm-panel-backup:ci /src/scripts/test-panel-backup.sh
      - name: Validate the production and rehearsal compose files
        env:
          MINIO_ROOT_USER: ci
          MINIO_ROOT_PASSWORD: ci-not-a-secret
          PANEL_PUBLIC_URL: https://panel.example.com
          ALLOWED_ORIGINS: https://panel.example.com
        run: |
          mkdir -p deploy/secrets
          touch deploy/secrets/postgres_password deploy/secrets/s3_restricted_password
          docker compose -f docker-compose.production.yml --env-file .env.production.example config -q
          docker compose -f docker-compose.production.yml -f docker-compose.rehearsal.yml --env-file .env.production.example config -q
          # Published images by tag.
          MABURVM_IMAGE_PREFIX=ghcr.io/example/maburvm MABURVM_VERSION=v0.0.0 \
            docker compose -f docker-compose.production.yml --env-file .env.production.example config --images | grep -qx 'ghcr.io/example/maburvm-panel:v0.0.0'

  whmcs:
    name: WHMCS modules (PHP lint and unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint
        # The runner image ships PHP and Composer.
        working-directory: integrations/whmcs
        run: find modules tests/src tests/bootstrap.php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        # Against stand-ins for WHMCS: this does not prove the modules inside a WHMCS install.
        working-directory: integrations/whmcs/tests
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpunit
      # The Paymenter and FOSSBilling modules ride in this job (its name is
      # kept so required checks stay as they are).
      - name: Lint Paymenter and FOSSBilling modules
        working-directory: integrations
        run: find paymenter fossbilling -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Paymenter unit tests
        # Against stand-ins for Paymenter's extension classes, not a Paymenter install.
        working-directory: integrations/paymenter/tests
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpunit
      - name: FOSSBilling unit tests
        # Against stand-ins for FOSSBilling's server manager classes, not a FOSSBilling install.
        working-directory: integrations/fossbilling/tests
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpunit
